<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" role="img" aria-label="Debt Term-Sheet Sizing and Loan Terms engine tile: each deal's max loan held to max loan-to-cost times its cost basis, with the all-in rate, every fee amount and the portfolio rollup re-derived from the base terms.">
  <defs>
    <pattern id="grid-dts" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#eef2f8" stroke-width="1"/></pattern>
    <marker id="arw-dts" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1200" height="675" fill="#f6f8fb"/><rect width="1200" height="675" fill="url(#grid-dts)"/>
  <rect x="16" y="16" width="1168" height="643" rx="18" fill="#ffffff" stroke="#e3e9f2" stroke-width="1.5"/>
  <text x="56" y="86" font-size="40" font-weight="700" fill="#0f2a5c">Debt Term-Sheet Sizing &amp; Loan Terms</text>
  <text x="58" y="120" font-size="19" fill="#5b6b84" letter-spacing="0.5">SFS-E41-DTS &#183; is the loan sized within the advance rate, and does every other term re-derive?</text>
  <rect x="1020" y="52" width="128" height="34" rx="17" fill="#eaf1ff" stroke="#c9dcff"/><text x="1084" y="75" font-size="15" font-weight="600" fill="#2563eb" text-anchor="middle">READ-ONLY</text>

  <!-- the deal being sized -->
  <rect x="56" y="250" width="204" height="122" rx="14" fill="#0f2a5c"/>
  <text x="158" y="286" font-size="16" fill="#9fc0ff" text-anchor="middle">DEAL</text>
  <text x="158" y="318" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle">DL-203</text>
  <text x="158" y="342" font-size="13" fill="#8fb2f2" text-anchor="middle">Ridgeline Terraces</text>
  <text x="158" y="360" font-size="13" fill="#8fb2f2" text-anchor="middle">bridge &#183; non-recourse</text>

  <path d="M260 311H360" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-dts)"/>
  <text x="310" y="299" font-size="13" fill="#5b6b84" text-anchor="middle">re-derived</text>
  <text x="310" y="333" font-size="13" fill="#5b6b84" text-anchor="middle">from its terms</text>

  <!-- per-deal tie-out -->
  <rect x="372" y="180" width="470" height="284" rx="14" fill="#ffffff" stroke="#c9dcff" stroke-width="1.5"/>
  <text x="392" y="212" font-size="16" font-weight="700" fill="#0f2a5c">Per-deal tie-out &#183; max LTC &#215; cost basis</text>
  <g font-size="15.5" fill="#0f2a5c">
    <circle cx="404" cy="244" r="8" fill="#15803d"/><text x="424" y="249">Max loan at the cap: 60.00% of cost basis (&#8804;)</text>
    <circle cx="404" cy="278" r="8" fill="#15803d"/><text x="424" y="283">Drawn balance within the commitment</text>
    <circle cx="404" cy="312" r="8" fill="#15803d"/><text x="424" y="317">Maturity 30 = base term 24 + extension 6</text>
    <circle cx="404" cy="346" r="8" fill="#15803d"/><text x="424" y="351">All-in rate = max(index + spread, floor)</text>
    <circle cx="404" cy="380" r="8" fill="#15803d"/><text x="424" y="385">Every fee = its rate on its correct base</text>
    <circle cx="404" cy="414" r="8" fill="#c0392b"/><text x="424" y="419" fill="#c0392b">One loan sized a cent over the advance rate</text>
    <circle cx="404" cy="448" r="8" fill="#c8912f"/><text x="424" y="453" fill="#c8912f">One term sheet expires inside the 45-day window</text>
  </g>

  <!-- verdict -->
  <rect x="866" y="250" width="278" height="122" rx="14" fill="#fdf2f2" stroke="#f0c2c2" stroke-width="1.5"/>
  <text x="1005" y="292" font-size="17" fill="#c0392b" text-anchor="middle">verdict: FAIL</text>
  <text x="1005" y="322" font-size="14" fill="#5b6b84" text-anchor="middle">the rollup foots and the rates recompute &#8212;</text>
  <text x="1005" y="344" font-size="14" fill="#5b6b84" text-anchor="middle">one loan is over its advance rate</text>

  <rect x="56" y="560" width="1088" height="58" rx="14" fill="#0f2a5c"/>
  <text x="82" y="596" font-size="18" font-weight="600" fill="#ffffff">21 controls</text>
  <text x="256" y="596" font-size="18" font-weight="600" fill="#9fc0ff">7 families</text>
  <text x="420" y="596" font-size="18" font-weight="600" fill="#ffffff">10,338 tests</text>
  <text x="600" y="596" font-size="18" font-weight="600" fill="#9fc0ff">read-only</text>
  <text x="1118" y="596" font-size="15" fill="#8fb2f2" text-anchor="end" letter-spacing="1.5">SFS-E41-DTS</text>
</svg>
