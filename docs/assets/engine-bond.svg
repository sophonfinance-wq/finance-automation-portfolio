<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" role="img" aria-label="Surety Bond and Collateral engine tile: a bond lifecycle from posted to accepted to released, with the developer's cash collateral that must be recovered when the obligation ends.">
  <defs>
    <pattern id="grid-bnd" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#eef2f8" stroke-width="1"/>
    </pattern>
    <marker id="arw-bnd" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#f6f8fb"/>
  <rect width="1200" height="675" fill="url(#grid-bnd)"/>
  <rect x="16" y="16" width="1168" height="643" rx="18" fill="#ffffff" stroke="#e3e9f2" stroke-width="1.5"/>

  <text x="56" y="86" font-size="40" font-weight="700" fill="#0f2a5c">Surety Bond &amp; Collateral</text>
  <text x="58" y="120" font-size="19" fill="#5b6b84" letter-spacing="0.5">SFS-E16-BND &#183; cash that never comes back</text>
  <rect x="1020" y="52" width="128" height="34" rx="17" fill="#eaf1ff" stroke="#c9dcff"/>
  <text x="1084" y="75" font-size="15" font-weight="600" fill="#2563eb" text-anchor="middle">READ-ONLY</text>

  <!-- lifecycle -->
  <text x="56" y="192" font-size="15" fill="#5b6b84" letter-spacing="0.5">BOND LIFECYCLE</text>
  <rect x="56" y="212" width="196" height="70" rx="12" fill="#eaf1ff" stroke="#c9dcff" stroke-width="1.5"/>
  <text x="154" y="245" font-size="18" font-weight="600" fill="#0f2a5c" text-anchor="middle">Posted</text>
  <text x="154" y="268" font-size="13" fill="#5b6b84" text-anchor="middle">penal sum $500,000</text>

  <path d="M252 247H300" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-bnd)"/>
  <rect x="306" y="212" width="196" height="70" rx="12" fill="#eef7f1" stroke="#bfe0cc" stroke-width="1.5"/>
  <text x="404" y="245" font-size="18" font-weight="600" fill="#0f2a5c" text-anchor="middle">Accepted</text>
  <text x="404" y="268" font-size="13" fill="#2f6b4f" text-anchor="middle">maintenance period runs</text>

  <path d="M502 247H550" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-bnd)"/>
  <rect x="556" y="212" width="196" height="70" rx="12" fill="#f4f6fa" stroke="#d6deea" stroke-width="1.5"/>
  <text x="654" y="245" font-size="18" font-weight="600" fill="#0f2a5c" text-anchor="middle">Released</text>
  <text x="654" y="268" font-size="13" fill="#5b6b84" text-anchor="middle">obligation ends</text>

  <!-- collateral recovery -->
  <path d="M654 282V352" fill="none" stroke="#c0392b" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#arw-bnd)"/>
  <rect x="452" y="360" width="404" height="96" rx="14" fill="#fbeceb" stroke="#e8b7b1" stroke-width="1.5"/>
  <text x="654" y="396" font-size="17" fill="#c0392b" text-anchor="middle">collateral not recovered from the surety</text>
  <text x="654" y="424" font-size="15" fill="#5b6b84" text-anchor="middle">$120,000 sits in restricted cash, looking exactly like cash</text>

  <!-- exposure panel -->
  <rect x="806" y="212" width="338" height="244" rx="14" fill="#0f2a5c"/>
  <text x="832" y="250" font-size="16" fill="#9fc0ff">AGGREGATE EXPOSURE</text>
  <text x="832" y="300" font-size="34" font-weight="700" fill="#ffffff">$3.4M / $5.0M</text>
  <text x="832" y="330" font-size="14" fill="#8fb2f2">penal sums consumed against the facility</text>
  <rect x="832" y="352" width="286" height="14" rx="7" fill="#1c3f74"/>
  <rect x="832" y="352" width="194" height="14" rx="7" fill="#00a8ff"/>
  <text x="832" y="404" font-size="14" fill="#9fc0ff">collateral ledger tied to the register</text>
  <text x="832" y="430" font-size="14" fill="#9fc0ff">premium earned to the day</text>

  <rect x="56" y="560" width="1088" height="58" rx="14" fill="#0f2a5c"/>
  <text x="82" y="596" font-size="18" font-weight="600" fill="#ffffff">29 controls</text>
  <text x="262" y="596" font-size="18" font-weight="600" fill="#9fc0ff">7 families</text>
  <text x="416" y="596" font-size="18" font-weight="600" fill="#ffffff">420 tests</text>
  <text x="562" y="596" font-size="18" font-weight="600" fill="#9fc0ff">0 tolerance</text>
  <text x="1118" y="596" font-size="15" fill="#8fb2f2" text-anchor="end" letter-spacing="1.5">SOPHON FINANCE SYSTEMS</text>
</svg>
