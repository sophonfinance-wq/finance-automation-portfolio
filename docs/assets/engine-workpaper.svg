<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Tax Workpaper Build &amp; Carry-Down engine tile: an isometric line drawing of a workpaper package under construction. Six source slabs at the left converge on a single node and feed the build. Three prior-year sheets sit frozen inside a bracket, and a newly constructed sheet is lifted clear above them, its year caption drawn in cobalt and cobalt carry-down arrows rising from the frozen layers into it. On the new sheet a cobalt path runs across one row through the member columns. At the right an evidence tab carries its citation lines and a subtotal rule closing on a cobalt zero, and beneath it a build register grid names one constructed cell. A dashed line runs from the pre-build image at the left along the base of the drawing to that register.">
  <title>Tax Workpaper Build &amp; Carry-Down</title>
  <defs>
    <style>
      .ink { fill: none; stroke: #2b3038; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: #2b3038; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
      .hair { fill: none; stroke: #9aa3ad; stroke-width: 1; stroke-linecap: round; }
      .face { fill: #eef1f4; }
      .face-2 { fill: #e3e7ec; }
      .face-3 { fill: #d6dbe2; }
      .accent { fill: none; stroke: #0f62fe; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
      .accent-thin { fill: none; stroke: #0f62fe; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .accent-fill { fill: #0f62fe; }
      .dash { stroke-dasharray: 9 8; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>

