  <path class="face-2" d="M 620 410 L 1020 290 L 1310 391 L 910 511 Z"/>
  <path class="ink" d="M 620 410 L 1020 290 L 1310 391 L 910 511 Z"/>
  <path class="face-2" d="M 620 410 L 910 511 L 910 525 L 620 424 Z"/>
  <path class="ink" d="M 620 410 L 910 511 L 910 525 L 620 424 Z"/>
