  <path class="accent-thin" d="M 1411 321 L 1571 273"/>
  <path class="accent-thin" d="M 1414 328 L 1574 280"/>
  <circle class="accent-fill" cx="1582" cy="277" r="5"/>

  <!-- ============ the build register: every constructed cell ============ -->
  <path class="accent" d="M 1298 562 L 1262 592"/>
  <path class="accent-fill" d="M 1252 600 L 1268 594 L 1261 585 Z"/>

  <path class="face-2" d="M 1250 620 L 1470 554 L 1570 589 L 1350 655 Z"/>
  <path class="ink" d="M 1250 620 L 1470 554 L 1570 589 L 1350 655 Z"/>
