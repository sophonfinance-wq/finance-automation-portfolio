  <path class="face-2" d="M 110 554 L 230 518 L 230 594 L 110 630 Z"/>
  <path class="ink" d="M 110 554 L 230 518 L 230 594 L 110 630 Z"/>
  <path class="hair" d="M 110 579 L 230 543"/>
