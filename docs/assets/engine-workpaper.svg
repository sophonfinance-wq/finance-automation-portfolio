  <path class="accent-fill" d="M 690 292 L 682 308 L 698 308 Z"/>
  <path class="accent" d="M 790 462 L 790 337"/>
  <path class="accent-fill" d="M 790 327 L 782 343 L 798 343 Z"/>

  <!-- ============ the evidence tab and its citation ============ -->
  <path class="accent" d="M 1318 240 L 1352 288"/>
  <path class="accent-fill" d="M 1358 298 L 1354 281 L 1344 288 Z"/>

  <path class="face" d="M 1350 300 L 1510 252 L 1580 276 L 1420 324 Z"/>
  <path class="ink" d="M 1350 300 L 1510 252 L 1580 276 L 1420 324 Z"/>
  <path class="face" d="M 1350 300 L 1420 324 L 1420 336 L 1350 312 Z"/>
  <path class="ink" d="M 1350 300 L 1420 324 L 1420 336 L 1350 312 Z"/>
  <path class="face" d="M 1420 324 L 1580 276 L 1580 288 L 1420 336 Z"/>
  <path class="ink" d="M 1420 324 L 1580 276 L 1580 288 L 1420 336 Z"/>
  <path class="hair" d="M 1368 306 L 1528 258"/>
  <path class="hair" d="M 1385 312 L 1545 264"/>
  <path class="hair" d="M 1402 318 L 1562 270"/>
