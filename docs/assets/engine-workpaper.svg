  <path class="hair" d="M 110 220 L 230 184"/>
  <!-- prior-year signed package -->
  <path class="face-2" d="M 110 266 L 230 230 L 230 306 L 110 342 Z"/>
  <path class="ink" d="M 110 266 L 230 230 L 230 306 L 110 342 Z"/>
  <path class="hair" d="M 110 291 L 230 255"/>
  <path class="hair" d="M 110 316 L 230 280"/>
  <!-- allocation register -->
  <path class="face-2" d="M 110 362 L 230 326 L 230 402 L 110 438 Z"/>
  <path class="ink" d="M 110 362 L 230 326 L 230 402 L 110 438 Z"/>
  <path class="hair" d="M 110 387 L 230 351"/>
  <path class="hair" d="M 110 412 L 230 376"/>
  <!-- accepted-exception register -->
  <path class="face-2" d="M 110 458 L 230 422 L 230 498 L 110 534 Z"/>
  <path class="ink" d="M 110 458 L 230 422 L 230 498 L 110 534 Z"/>
  <path class="hair" d="M 110 483 L 230 447"/>
  <path class="hair" d="M 110 508 L 230 472"/>
