<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" role="img" aria-label="Earnest-Money Deposit Trust engine tile: the deposit ledger, the escrow agent's statement and the construction-loan paydown register tied three ways per unit to zero variance, with the cancellation split and the reconciliation summary recomputed from the deposits beneath them.">
  <defs>
    <pattern id="grid-emd" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#eef2f8" stroke-width="1"/></pattern>
    <marker id="arw-emd" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1200" height="675" fill="#f6f8fb"/><rect width="1200" height="675" fill="url(#grid-emd)"/>
  <rect x="16" y="16" width="1168" height="643" rx="18" fill="#ffffff" stroke="#e3e9f2" stroke-width="1.5"/>
  <text x="56" y="86" font-size="40" font-weight="700" fill="#0f2a5c">Earnest-Money Deposit Trust</text>
  <text x="58" y="120" font-size="18" fill="#5b6b84" letter-spacing="0.4">SFS-E37-EMD &#183; do the ledger, the escrow agent and the loan describe the same money, to the cent?</text>
  <rect x="1020" y="46" width="128" height="34" rx="17" fill="#eaf1ff" stroke="#c9dcff"/><text x="1084" y="69" font-size="15" font-weight="600" fill="#2563eb" text-anchor="middle">READ-ONLY</text>

  <!-- three source records -->
  <g>
    <rect x="56" y="206" width="216" height="72" rx="12" fill="#0f2a5c"/>
    <text x="164" y="238" font-size="15.5" font-weight="700" fill="#ffffff" text-anchor="middle">DEPOSIT LEDGER</text>
    <text x="164" y="261" font-size="12.5" fill="#8fb2f2" text-anchor="middle">earnest money the books support</text>
  </g>
  <g>
    <rect x="56" y="300" width="216" height="72" rx="12" fill="#0f2a5c"/>
    <text x="164" y="332" font-size="15.5" font-weight="700" fill="#ffffff" text-anchor="middle">ESCROW AGENT</text>
    <text x="164" y="355" font-size="12.5" fill="#8fb2f2" text-anchor="middle">earnest money the agent holds</text>
  </g>
  <g>
    <rect x="56" y="394" width="216" height="72" rx="12" fill="#0f2a5c"/>
    <text x="164" y="426" font-size="15.5" font-weight="700" fill="#ffffff" text-anchor="middle">LOAN PAYDOWN</text>
    <text x="164" y="449" font-size="12.5" fill="#8fb2f2" text-anchor="middle">net principal swept, per unit</text>
  </g>

  <path d="M272 242C320 242 320 320 356 320" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arw-emd)"/>
  <path d="M272 336H356" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arw-emd)"/>
  <path d="M272 430C320 430 320 352 356 352" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arw-emd)"/>
  <text x="314" y="300" font-size="12" fill="#5b6b84" text-anchor="middle">tie three ways</text>

  <!-- three-way tie-out panel -->
  <rect x="360" y="188" width="472" height="296" rx="14" fill="#ffffff" stroke="#c9dcff" stroke-width="1.5"/>
  <text x="382" y="220" font-size="16" font-weight="700" fill="#0f2a5c">Three-way tie-out per unit &#183; zero variance</text>
  <g font-size="14.5" fill="#0f2a5c">
    <circle cx="394" cy="252" r="7.5" fill="#15803d"/><text x="414" y="257">Agent earnest money equals the ledger</text>
    <circle cx="394" cy="286" r="7.5" fill="#15803d"/><text x="414" y="291">Net loan paydown equals swept earnest money</text>
    <circle cx="394" cy="320" r="7.5" fill="#15803d"/><text x="414" y="325">Cash splits into upgrade + earnest money</text>
    <circle cx="394" cy="354" r="7.5" fill="#15803d"/><text x="414" y="359">Cancellation splits into fee + refund, sweep reversed</text>
    <circle cx="394" cy="388" r="7.5" fill="#c0392b"/><text x="414" y="393" fill="#c0392b">Agent holds money the books never booked &#8212; gap</text>
    <circle cx="394" cy="422" r="7.5" fill="#c0392b"/><text x="414" y="427" fill="#c0392b">Deposit posted but no paydown behind it &#8212; sweep drift</text>
    <circle cx="394" cy="456" r="7.5" fill="#c8912f"/><text x="414" y="461" fill="#c8912f">Closed unit still on the agent's open statement &#8212; stale</text>
  </g>

  <path d="M832 300H872" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arw-emd)"/>

  <!-- verdict -->
  <rect x="876" y="206" width="268" height="128" rx="14" fill="#fdf7ec" stroke="#eecfa3" stroke-width="1.5"/>
  <text x="1010" y="248" font-size="17" font-weight="700" fill="#c8912f" text-anchor="middle">verdict: REVIEW</text>
  <text x="1010" y="278" font-size="13.5" fill="#5b6b84" text-anchor="middle">the three records reconcile &#8212;</text>
  <text x="1010" y="298" font-size="13.5" fill="#5b6b84" text-anchor="middle">a closed unit sits on a stale</text>
  <text x="1010" y="318" font-size="13.5" fill="#5b6b84" text-anchor="middle">open-escrow statement</text>

  <!-- summary recomputed -->
  <rect x="876" y="352" width="268" height="116" rx="14" fill="#f4f8ff" stroke="#c9dcff" stroke-width="1.5"/>
  <text x="1010" y="386" font-size="14.5" font-weight="700" fill="#0f2a5c" text-anchor="middle">reconciliation summary</text>
  <text x="1010" y="410" font-size="13" fill="#5b6b84" text-anchor="middle">variances, flags, totals and</text>
  <text x="1010" y="430" font-size="13" fill="#5b6b84" text-anchor="middle">bucket sums recomputed from</text>
  <text x="1010" y="450" font-size="13" fill="#5b6b84" text-anchor="middle">the deposits, not read back</text>

  <rect x="56" y="560" width="1088" height="58" rx="14" fill="#0f2a5c"/>
  <text x="82" y="596" font-size="18" font-weight="600" fill="#ffffff">27 controls</text>
  <text x="256" y="596" font-size="18" font-weight="600" fill="#9fc0ff">10 families</text>
  <text x="420" y="596" font-size="18" font-weight="600" fill="#ffffff">10,407 tests</text>
  <text x="566" y="596" font-size="18" font-weight="600" fill="#9fc0ff">read-only</text>
  <text x="1118" y="596" font-size="15" fill="#8fb2f2" text-anchor="end" letter-spacing="1.5">SFS-E37-EMD</text>
</svg>
