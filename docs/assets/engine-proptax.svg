<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" role="img" aria-label="Property Tax engine tile: a parent parcel platted into lots that close one at a time while the tax roll keeps billing the account it always has.">
  <defs>
    <pattern id="grid-ptx" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#eef2f8" stroke-width="1"/>
    </pattern>
    <marker id="arw-ptx" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#f6f8fb"/>
  <rect width="1200" height="675" fill="url(#grid-ptx)"/>
  <rect x="16" y="16" width="1168" height="643" rx="18" fill="#ffffff" stroke="#e3e9f2" stroke-width="1.5"/>

  <text x="56" y="86" font-size="40" font-weight="700" fill="#0f2a5c">Property Tax</text>
  <text x="58" y="120" font-size="19" fill="#5b6b84" letter-spacing="0.5">SFS-E15-PPT &#183; whose parcel is it now?</text>
  <rect x="1020" y="52" width="128" height="34" rx="17" fill="#eaf1ff" stroke="#c9dcff"/>
  <text x="1084" y="75" font-size="15" font-weight="600" fill="#2563eb" text-anchor="middle">READ-ONLY</text>

  <!-- parent parcel -->
  <rect x="56" y="250" width="188" height="120" rx="14" fill="#0f2a5c"/>
  <text x="150" y="296" font-size="17" fill="#9fc0ff" text-anchor="middle">PARENT PARCEL</text>
  <text x="150" y="330" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">P-2100</text>
  <text x="150" y="356" font-size="13" fill="#8fb2f2" text-anchor="middle">platted into 4 lots</text>

  <path d="M244 285H356" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-ptx)"/>
  <path d="M244 310H356" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-ptx)"/>
  <path d="M244 335H356" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-ptx)"/>
  <text x="300" y="250" font-size="13" fill="#5b6b84" text-anchor="middle">segregated on the assessor&#8217;s clock</text>

  <!-- lots -->
  <g>
    <rect x="372" y="196" width="252" height="58" rx="12" fill="#ffffff" stroke="#c9dcff" stroke-width="1.5"/>
    <text x="392" y="222" font-size="16" font-weight="600" fill="#0f2a5c">Lot 1 &#183; held</text>
    <text x="392" y="242" font-size="13" fill="#5b6b84">on the developer&#8217;s books</text>
    <circle cx="600" cy="225" r="9" fill="#15803d"/>

    <rect x="372" y="262" width="252" height="58" rx="12" fill="#ffffff" stroke="#c9dcff" stroke-width="1.5"/>
    <text x="392" y="288" font-size="16" font-weight="600" fill="#0f2a5c">Lot 2 &#183; held</text>
    <text x="392" y="308" font-size="13" fill="#5b6b84">on the developer&#8217;s books</text>
    <circle cx="600" cy="291" r="9" fill="#15803d"/>

    <rect x="372" y="328" width="252" height="58" rx="12" fill="#fdf4ea" stroke="#eecfa3" stroke-width="1.5"/>
    <text x="392" y="354" font-size="16" font-weight="600" fill="#0f2a5c">Lot 3 &#183; sold</text>
    <text x="392" y="374" font-size="13" fill="#c8912f">closed &#8212; ownership moved</text>
    <circle cx="600" cy="357" r="9" fill="#c8912f"/>
  </g>

  <!-- the roll keeps billing -->
  <path d="M624 357H720" fill="none" stroke="#c0392b" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#arw-ptx)"/>
  <rect x="726" y="250" width="250" height="120" rx="14" fill="#fbeceb" stroke="#e8b7b1" stroke-width="1.5"/>
  <text x="851" y="290" font-size="16" fill="#c0392b" text-anchor="middle">tax roll still bills P-2100</text>
  <text x="851" y="322" font-size="15" fill="#5b6b84" text-anchor="middle">the bill looks right &#8212;</text>
  <text x="851" y="344" font-size="15" fill="#5b6b84" text-anchor="middle">for somebody else&#8217;s house</text>

  <text x="1055" y="300" font-size="14" fill="#5b6b84" text-anchor="middle">regimes are data,</text>
  <text x="1055" y="322" font-size="14" fill="#5b6b84" text-anchor="middle">not code</text>

  <rect x="56" y="560" width="1088" height="58" rx="14" fill="#0f2a5c"/>
  <text x="82" y="596" font-size="18" font-weight="600" fill="#ffffff">26 controls</text>
  <text x="262" y="596" font-size="18" font-weight="600" fill="#9fc0ff">7 families</text>
  <text x="416" y="596" font-size="18" font-weight="600" fill="#ffffff">389 tests</text>
  <text x="562" y="596" font-size="18" font-weight="600" fill="#9fc0ff">3 jurisdictions</text>
  <text x="1118" y="596" font-size="15" fill="#8fb2f2" text-anchor="end" letter-spacing="1.5">SOPHON FINANCE SYSTEMS</text>
</svg>
