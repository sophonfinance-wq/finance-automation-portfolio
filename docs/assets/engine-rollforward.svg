<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Trial-Balance Roll-Forward engine tile: an isometric workpaper grid with last year's structure entering at the left, a column retired, a column renamed and a column added along the top edge, a backup tab running the full width beneath with tie-lines rising to individual cells, and two source columns feeding in from the right of which only one is used.">
  <title>Trial-Balance Roll-Forward</title>
  <defs>
    <style>
      .ink { fill: none; stroke: #2b3038; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: #2b3038; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
      .hair { fill: none; stroke: #9aa3ad; stroke-width: 1; stroke-linecap: round; }
      .face { fill: #eef1f4; }
      .face-2 { fill: #e3e7ec; }
      .face-3 { fill: #d6dbe2; }
      .accent { fill: none; stroke: #0f62fe; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
      .accent-thin { fill: none; stroke: #0f62fe; stroke-width: 1.6; stroke-linecap: round; }
      .accent-fill { fill: #0f62fe; }
      .dash { stroke-dasharray: 9 8; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>

  <!-- ============ the workpaper grid: isometric slab ============ -->
  <!-- top face -->
  <path class="face" d="M 300 430 L 900 250 L 1330 400 L 730 580 Z"/>
  <path class="ink" d="M 300 430 L 900 250 L 1330 400 L 730 580 Z"/>
  <!-- front edge -->
  <path class="face-2" d="M 300 430 L 730 580 L 730 626 L 300 476 Z"/>
  <path class="ink" d="M 300 430 L 730 580 L 730 626 L 300 476 Z"/>
  <!-- right edge -->
  <path class="face-3" d="M 730 580 L 1330 400 L 1330 446 L 730 626 Z"/>
  <path class="ink" d="M 730 580 L 1330 400 L 1330 446 L 730 626 Z"/>

  <!-- column separators across the top face (entity columns) -->
  <path class="thin" d="M 386 460 L 986 280"/>
  <path class="thin" d="M 472 490 L 1072 310"/>
  <path class="thin" d="M 558 520 L 1158 340"/>
  <path class="thin" d="M 644 550 L 1244 370"/>

  <!-- row lines running the other way -->
  <path class="hair" d="M 386 401 L 816 551"/>
  <path class="hair" d="M 472 375 L 902 525"/>
  <path class="hair" d="M 558 349 L 988 499"/>
  <path class="hair" d="M 644 323 L 1074 473"/>
  <path class="hair" d="M 730 297 L 1160 447"/>
  <path class="hair" d="M 816 271 L 1246 421"/>

  <!-- ============ last year's structure entering at the left ============ -->
  <path class="face-2" d="M 120 402 L 250 363 L 250 470 L 120 509 Z"/>
  <path class="ink" d="M 120 402 L 250 363 L 250 470 L 120 509 Z"/>
  <path class="thin" d="M 120 428 L 250 389"/>
  <path class="thin" d="M 120 454 L 250 415"/>
  <path class="thin" d="M 120 480 L 250 441"/>
  <!-- carried forward into the grid -->
  <path class="accent" d="M 258 418 L 302 431"/>
  <path class="accent-fill" d="M 300 424 l 22 7 l -22 7 z"/>

  <!-- ============ three station marks along the top edge ============ -->
  <!-- retired column: struck through -->
  <g>
    <circle class="face" cx="742" cy="315" r="26"/>
    <circle class="ink" cx="742" cy="315" r="26"/>
    <path class="ink" d="M 730 303 L 754 327"/>
    <path class="ink" d="M 754 303 L 730 327"/>
  </g>
  <!-- renamed column: carried once -->
  <g>
    <circle class="face" cx="866" cy="278" r="26"/>
    <circle class="ink" cx="866" cy="278" r="26"/>
    <path class="accent-thin" d="M 852 278 L 878 278"/>
    <path class="accent-fill" d="M 874 272 l 12 6 l -12 6 z"/>
  </g>
  <!-- added column: new -->
  <g>
    <circle class="face" cx="990" cy="241" r="26"/>
    <circle class="ink" cx="990" cy="241" r="26"/>
    <path class="accent-thin" d="M 990 229 L 990 253"/>
    <path class="accent-thin" d="M 978 241 L 1002 241"/>
  </g>

  <!-- ============ two source columns feeding from the right ============ -->
  <!-- the balance column: solid, used -->
  <path class="face" d="M 1400 300 L 1500 270 L 1500 430 L 1400 460 Z"/>
  <path class="ink" d="M 1400 300 L 1500 270 L 1500 430 L 1400 460 Z"/>
  <path class="hair" d="M 1400 330 L 1500 300"/>
  <path class="hair" d="M 1400 360 L 1500 330"/>
  <path class="hair" d="M 1400 390 L 1500 360"/>
  <path class="hair" d="M 1400 420 L 1500 390"/>
  <!-- the activity column: dashed, deliberately unused -->
  <path class="thin dash" d="M 1280 340 L 1380 310 L 1380 470 L 1280 500 Z"/>

  <!-- the balance column is the one that feeds the grid -->
  <path class="accent" d="M 1396 372 L 1342 390"/>
  <path class="accent-fill" d="M 1348 383 l -22 7 l 22 7 z"/>

  <!-- ============ backup tab beneath, full width ============ -->
  <path class="face-2" d="M 300 700 L 900 700 L 900 760 L 300 760 Z"/>
  <path class="ink" d="M 300 700 L 900 700 L 900 760 L 300 760 Z"/>
  <path class="thin" d="M 300 720 L 900 720"/>
  <path class="hair" d="M 420 700 L 420 760"/>
  <path class="hair" d="M 540 700 L 540 760"/>
  <path class="hair" d="M 660 700 L 660 760"/>
  <path class="hair" d="M 780 700 L 780 760"/>

  <!-- tie-lines rising from the backup tab to individual cells -->
  <path class="accent-thin" d="M 480 700 L 480 620 L 512 604"/>
  <path class="accent-thin" d="M 600 700 L 600 600 L 636 582"/>
  <path class="accent-thin" d="M 720 700 L 720 596 L 758 577"/>
  <circle class="accent-fill" cx="512" cy="604" r="5"/>
  <circle class="accent-fill" cx="636" cy="582" r="5"/>
  <circle class="accent-fill" cx="758" cy="577" r="5"/>

  <!-- ============ the combined column, struck from the grid ============ -->
  <path class="face-3" d="M 1340 452 L 1440 422 L 1440 520 L 1340 550 Z"/>
  <path class="ink" d="M 1340 452 L 1440 422 L 1440 520 L 1340 550 Z"/>
  <path class="accent" d="M 1240 470 L 1336 492"/>
  <path class="accent-fill" d="M 1330 485 l 22 7 l -22 7 z"/>
</svg>
