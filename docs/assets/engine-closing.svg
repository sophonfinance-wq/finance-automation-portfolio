<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" role="img" aria-label="Home Sale Closing and Settlement Tie-Out engine tile: each closed home's settlement statement, balanced closing entry, revenue line, loan release and cost-of-sale relief re-derived from the base facts, and the rollup's count, total and tie-out flags recomputed from the units beneath.">
  <defs>
    <pattern id="grid-coe" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#eef2f8" stroke-width="1"/></pattern>
    <marker id="arw-coe" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1200" height="675" fill="#f6f8fb"/><rect width="1200" height="675" fill="url(#grid-coe)"/>
  <rect x="16" y="16" width="1168" height="643" rx="18" fill="#ffffff" stroke="#e3e9f2" stroke-width="1.5"/>
  <text x="56" y="86" font-size="38" font-weight="700" fill="#0f2a5c">Home Sale Closing &amp; Settlement Tie-Out</text>
  <text x="58" y="120" font-size="18" fill="#5b6b84" letter-spacing="0.4">SFS-E32-COE &#183; did the home close, and does its closing package agree with itself?</text>
  <rect x="1020" y="52" width="128" height="34" rx="17" fill="#eaf1ff" stroke="#c9dcff"/><text x="1084" y="75" font-size="15" font-weight="600" fill="#2563eb" text-anchor="middle">READ-ONLY</text>

  <!-- unit register -->
  <rect x="56" y="250" width="196" height="150" rx="14" fill="#0f2a5c"/>
  <text x="154" y="286" font-size="15" fill="#9fc0ff" text-anchor="middle">UNIT REGISTER</text>
  <text x="154" y="316" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">U-101 &#8230; U-104</text>
  <text x="154" y="342" font-size="12.5" fill="#8fb2f2" text-anchor="middle">Brightwater Commons</text>
  <text x="154" y="372" font-size="12.5" fill="#8fb2f2" text-anchor="middle">closed &#183; base facts</text>

  <path d="M252 325H346" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-coe)"/>
  <text x="299" y="313" font-size="12.5" fill="#5b6b84" text-anchor="middle">re-derive</text>
  <text x="299" y="346" font-size="12.5" fill="#5b6b84" text-anchor="middle">the package</text>

  <!-- closing package: the five re-derived artifacts -->
  <rect x="358" y="176" width="470" height="300" rx="14" fill="#ffffff" stroke="#c9dcff" stroke-width="1.5"/>
  <text x="378" y="208" font-size="16" font-weight="700" fill="#0f2a5c">Closing package &#183; every figure recomputed</text>
  <g font-size="15" fill="#0f2a5c">
    <circle cx="390" cy="242" r="7.5" fill="#15803d"/><text x="410" y="247">Settlement statement re-sums to net to seller</text>
    <circle cx="390" cy="278" r="7.5" fill="#15803d"/><text x="410" y="283">Closing entry foots; receivable is the plug</text>
    <circle cx="390" cy="314" r="7.5" fill="#15803d"/><text x="410" y="319">Revenue recognised in the close-of-escrow month</text>
    <circle cx="390" cy="350" r="7.5" fill="#15803d"/><text x="410" y="355">Loan release rolls forward, ties the lender</text>
    <circle cx="390" cy="386" r="7.5" fill="#15803d"/><text x="410" y="391">Cost-of-sale margin relief recomputes</text>
    <circle cx="390" cy="422" r="7.5" fill="#c8912f"/><text x="410" y="427" fill="#c8912f">Broker commission booked off proforma &#8212; flag</text>
    <circle cx="390" cy="452" r="7.5" fill="#c0392b"/><text x="410" y="457" fill="#c0392b">One remittance short of the release price &#8212; fail</text>
  </g>

  <path d="M828 326H906" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-coe)"/>
  <text x="867" y="314" font-size="12.5" fill="#5b6b84" text-anchor="middle">rollup</text>

  <!-- rollup report / verdict -->
  <rect x="918" y="250" width="226" height="150" rx="14" fill="#fdf7ec" stroke="#eecfa3" stroke-width="1.5"/>
  <text x="1031" y="286" font-size="16" fill="#c8912f" text-anchor="middle">verdict: REVIEW</text>
  <text x="1031" y="316" font-size="12.5" fill="#5b6b84" text-anchor="middle">closed count and net-to-seller</text>
  <text x="1031" y="336" font-size="12.5" fill="#5b6b84" text-anchor="middle">total tie the units beneath &#8212;</text>
  <text x="1031" y="360" font-size="12.5" fill="#5b6b84" text-anchor="middle">a commission needs confirming,</text>
  <text x="1031" y="380" font-size="12.5" fill="#5b6b84" text-anchor="middle">every tie-out flag recomputed</text>

  <rect x="56" y="560" width="1088" height="58" rx="14" fill="#0f2a5c"/>
  <text x="82" y="596" font-size="18" font-weight="600" fill="#ffffff">25 controls</text>
  <text x="256" y="596" font-size="18" font-weight="600" fill="#9fc0ff">9 families</text>
  <text x="410" y="596" font-size="18" font-weight="600" fill="#ffffff">10,379 tests</text>
  <text x="556" y="596" font-size="18" font-weight="600" fill="#9fc0ff">read-only</text>
  <text x="1118" y="596" font-size="15" fill="#8fb2f2" text-anchor="end" letter-spacing="1.5">SFS-E32-COE</text>
</svg>
