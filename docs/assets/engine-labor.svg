<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" role="img" aria-label="Project Labor Charge engine tile: an employee charged to a project only through an advance authorization, the monthly charge re-derived and held inside the labor budget.">
  <defs>
    <pattern id="grid-lab" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#eef2f8" stroke-width="1"/></pattern>
    <marker id="arw-lab" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1200" height="675" fill="#f6f8fb"/><rect width="1200" height="675" fill="url(#grid-lab)"/>
  <rect x="16" y="16" width="1168" height="643" rx="18" fill="#ffffff" stroke="#e3e9f2" stroke-width="1.5"/>
  <text x="56" y="86" font-size="40" font-weight="700" fill="#0f2a5c">Project Labor Charge</text>
  <text x="58" y="120" font-size="19" fill="#5b6b84" letter-spacing="0.5">SFS-E20-LAB &#183; charged only when authorized</text>
  <rect x="1020" y="52" width="128" height="34" rx="17" fill="#eaf1ff" stroke="#c9dcff"/><text x="1084" y="75" font-size="15" font-weight="600" fill="#2563eb" text-anchor="middle">READ-ONLY</text>

  <!-- employee -->
  <rect x="56" y="252" width="184" height="116" rx="14" fill="#0f2a5c"/>
  <text x="148" y="296" font-size="16" fill="#9fc0ff" text-anchor="middle">EMPLOYEE</text>
  <text x="148" y="328" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">D. Ashcombe</text>
  <text x="148" y="354" font-size="13" fill="#8fb2f2" text-anchor="middle">burdened cost / mo</text>

  <path d="M240 310H336" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-lab)"/>
  <!-- authorization -->
  <rect x="342" y="234" width="270" height="152" rx="14" fill="#ffffff" stroke="#c9dcff" stroke-width="1.5"/>
  <text x="362" y="266" font-size="16" font-weight="700" fill="#0f2a5c">Authorization</text>
  <g font-size="14.5" fill="#5b6b84">
    <text x="362" y="294">Noticed in advance &#10003;</text>
    <text x="362" y="320">Cost code 62-100 on budget &#10003;</text>
    <text x="362" y="346">40% of burdened cost</text>
    <text x="362" y="372" fill="#0f2a5c" font-weight="700">= $6,240 / month</text>
  </g>

  <path d="M612 310H708" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-lab)"/>
  <text x="660" y="298" font-size="12.5" fill="#5b6b84" text-anchor="middle">monthly</text>
  <text x="660" y="332" font-size="12.5" fill="#5b6b84" text-anchor="middle">invoice</text>

  <!-- project + budget -->
  <rect x="714" y="234" width="430" height="152" rx="14" fill="#ffffff" stroke="#c9dcff" stroke-width="1.5"/>
  <text x="734" y="266" font-size="16" font-weight="700" fill="#0f2a5c">Alderpoint Terraces &#183; labor budget</text>
  <rect x="734" y="286" width="390" height="20" rx="10" fill="#eef2f8"/>
  <rect x="734" y="286" width="255" height="20" rx="10" fill="#2563eb"/>
  <text x="734" y="336" font-size="14.5" fill="#5b6b84">charged to date $74,880 of $114,000</text>
  <text x="734" y="362" font-size="14.5" fill="#2f6b4f">invoice foots to the charges &#183; ledger ties &#10003;</text>

  <rect x="56" y="560" width="1088" height="58" rx="14" fill="#0f2a5c"/>
  <text x="82" y="596" font-size="18" font-weight="600" fill="#ffffff">26 controls</text>
  <text x="256" y="596" font-size="18" font-weight="600" fill="#9fc0ff">8 families</text>
  <text x="410" y="596" font-size="18" font-weight="600" fill="#ffffff">382 tests</text>
  <text x="556" y="596" font-size="18" font-weight="600" fill="#9fc0ff">held to budget</text>
  <text x="1118" y="596" font-size="15" fill="#8fb2f2" text-anchor="end" letter-spacing="1.5">SOPHON FINANCE SYSTEMS</text>
</svg>
