<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" role="img" aria-label="Wire &amp; Transfer Release Control engine tile: each outbound packet gated on two distinct authorized signers, an approved or called-back beneficiary, a routing number that resolves to the named bank, and a funding account that covers the amount, with every releasable flag recomputed from the evidence.">
  <defs>
    <pattern id="grid-wrl" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#eef2f8" stroke-width="1"/></pattern>
    <marker id="arw-wrl" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1200" height="675" fill="#f6f8fb"/><rect width="1200" height="675" fill="url(#grid-wrl)"/>
  <rect x="16" y="16" width="1168" height="643" rx="18" fill="#ffffff" stroke="#e3e9f2" stroke-width="1.5"/>
  <text x="56" y="86" font-size="40" font-weight="700" fill="#0f2a5c">Wire &amp; Transfer Release Control</text>
  <text x="58" y="120" font-size="19" fill="#5b6b84" letter-spacing="0.5">SFS-E29-WRL &#183; did two different people release it, to an approved account it can fund?</text>
  <rect x="1020" y="52" width="128" height="34" rx="17" fill="#eaf1ff" stroke="#c9dcff"/><text x="1084" y="75" font-size="15" font-weight="600" fill="#2563eb" text-anchor="middle">READ-ONLY</text>

  <!-- wire packet -->
  <rect x="56" y="250" width="204" height="122" rx="14" fill="#0f2a5c"/>
  <text x="158" y="292" font-size="16" fill="#9fc0ff" text-anchor="middle">WIRE PACKET</text>
  <text x="158" y="326" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle">W-1005</text>
  <text x="158" y="352" font-size="13" fill="#8fb2f2" text-anchor="middle">two signers &#183; beneficiary &#183; funded</text>

  <path d="M260 311H360" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-wrl)"/>
  <text x="310" y="299" font-size="13" fill="#5b6b84" text-anchor="middle">gated</text>
  <text x="310" y="333" font-size="13" fill="#5b6b84" text-anchor="middle">before release</text>

  <!-- release gates -->
  <rect x="372" y="176" width="478" height="300" rx="14" fill="#ffffff" stroke="#c9dcff" stroke-width="1.5"/>
  <text x="392" y="208" font-size="16" font-weight="700" fill="#0f2a5c">Release gates &#183; exact &#62; / &#61;&#61;</text>
  <g font-size="15.5" fill="#0f2a5c">
    <circle cx="404" cy="240" r="8" fill="#15803d"/><text x="424" y="245">Two distinct signers, authorization complete</text>
    <circle cx="404" cy="274" r="8" fill="#15803d"/><text x="424" y="279">Each signer authorized, amount within limit</text>
    <circle cx="404" cy="308" r="8" fill="#15803d"/><text x="424" y="313">Beneficiary on template, or callback cleared</text>
    <circle cx="404" cy="342" r="8" fill="#15803d"/><text x="424" y="347">Routing checksum valid, resolves to named bank</text>
    <circle cx="404" cy="376" r="8" fill="#15803d"/><text x="424" y="381">Funding account covers the amount, no duplicate</text>
    <circle cx="404" cy="410" r="8" fill="#c0392b"/><text x="424" y="415" fill="#c0392b">One packet a cent over its authority limit &#8212; blocked</text>
    <circle cx="404" cy="444" r="8" fill="#c8912f"/><text x="424" y="449" fill="#c8912f">One off-template payee cleared callback &#8212; review</text>
  </g>

  <!-- verdict -->
  <rect x="874" y="250" width="270" height="122" rx="14" fill="#fdecec" stroke="#eeb3b3" stroke-width="1.5"/>
  <text x="1009" y="292" font-size="17" fill="#c0392b" text-anchor="middle">verdict: FAIL</text>
  <text x="1009" y="322" font-size="14" fill="#5b6b84" text-anchor="middle">signers, routing and funding tie &#8212;</text>
  <text x="1009" y="344" font-size="14" fill="#5b6b84" text-anchor="middle">one wire ran over its authority limit</text>

  <rect x="56" y="560" width="1088" height="58" rx="14" fill="#0f2a5c"/>
  <text x="82" y="596" font-size="18" font-weight="600" fill="#ffffff">23 controls</text>
  <text x="256" y="596" font-size="18" font-weight="600" fill="#9fc0ff">9 families</text>
  <text x="404" y="596" font-size="18" font-weight="600" fill="#ffffff">10,347 tests</text>
  <text x="558" y="596" font-size="18" font-weight="600" fill="#9fc0ff">read-only</text>
  <text x="1118" y="596" font-size="15" fill="#8fb2f2" text-anchor="end" letter-spacing="1.5">SFS-E29-WRL</text>
</svg>
