<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" role="img" aria-label="Financing Execution &amp; Schedule Variance engine tile: every milestone variance re-derived as Current minus Prior, this month's Prior tied to last month's Current, the Original baseline frozen, and the active, overdue and financing-total rollups recomputed from the workstreams.">
  <defs>
    <pattern id="grid-fex" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#eef2f8" stroke-width="1"/></pattern>
    <marker id="arw-fex" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1200" height="675" fill="#f6f8fb"/><rect width="1200" height="675" fill="url(#grid-fex)"/>
  <rect x="16" y="16" width="1168" height="643" rx="18" fill="#ffffff" stroke="#e3e9f2" stroke-width="1.5"/>
  <text x="56" y="84" font-size="35" font-weight="700" fill="#0f2a5c">Financing Execution &#38; Schedule Variance</text>
  <text x="58" y="118" font-size="17" fill="#5b6b84" letter-spacing="0.4">SFS-E28-FEX &#183; does each variance re-derive, and does the report tie to the month before it?</text>
  <rect x="1020" y="52" width="128" height="34" rx="17" fill="#eaf1ff" stroke="#c9dcff"/><text x="1084" y="75" font-size="15" font-weight="600" fill="#2563eb" text-anchor="middle">READ-ONLY</text>

  <!-- workstream card -->
  <rect x="56" y="248" width="212" height="140" rx="14" fill="#0f2a5c"/>
  <text x="162" y="288" font-size="15" fill="#9fc0ff" text-anchor="middle">WORKSTREAM &#183; DEBT</text>
  <text x="162" y="320" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">WS-01</text>
  <text x="162" y="348" font-size="12.5" fill="#8fb2f2" text-anchor="middle">Original | Prior | Current</text>
  <text x="162" y="368" font-size="12.5" fill="#8fb2f2" text-anchor="middle">Variance = Current &#8722; Prior</text>

  <path d="M268 318H368" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-fex)"/>
  <text x="318" y="306" font-size="13" fill="#5b6b84" text-anchor="middle">re-derived</text>
  <text x="318" y="340" font-size="13" fill="#5b6b84" text-anchor="middle">not read back</text>

  <!-- re-derivation checks -->
  <rect x="380" y="188" width="486" height="266" rx="14" fill="#ffffff" stroke="#c9dcff" stroke-width="1.5"/>
  <text x="400" y="220" font-size="16" font-weight="700" fill="#0f2a5c">Re-derived from the schedule &#183; exact ==</text>
  <g font-size="15" fill="#0f2a5c">
    <circle cx="412" cy="250" r="8" fill="#15803d"/><text x="432" y="255">Variance ties Current &#8722; Prior in whole days</text>
    <circle cx="412" cy="282" r="8" fill="#15803d"/><text x="432" y="287">Prior ties last month's Current (roll-forward)</text>
    <circle cx="412" cy="314" r="8" fill="#15803d"/><text x="432" y="319">Original baseline frozen across months</text>
    <circle cx="412" cy="346" r="8" fill="#15803d"/><text x="432" y="351">Playbook complete per financing type</text>
    <circle cx="412" cy="378" r="8" fill="#15803d"/><text x="432" y="383">Gantt bar sits in its target-closing month</text>
    <circle cx="412" cy="410" r="8" fill="#c8912f"/><text x="432" y="415" fill="#c8912f">One overdue flag stale vs the date gate &#8212; review</text>
  </g>

  <!-- rollup / verdict -->
  <rect x="890" y="248" width="254" height="140" rx="14" fill="#fdf7ec" stroke="#eecfa3" stroke-width="1.5"/>
  <text x="1017" y="286" font-size="17" fill="#c8912f" text-anchor="middle">verdict: REVIEW</text>
  <text x="1017" y="316" font-size="13.5" fill="#5b6b84" text-anchor="middle">active / overdue / total all</text>
  <text x="1017" y="336" font-size="13.5" fill="#5b6b84" text-anchor="middle">recompute from the register &#8212;</text>
  <text x="1017" y="362" font-size="13.5" fill="#5b6b84" text-anchor="middle">one overdue flag needs a human</text>

  <rect x="56" y="560" width="1088" height="58" rx="14" fill="#0f2a5c"/>
  <text x="82" y="596" font-size="18" font-weight="600" fill="#ffffff">21 controls</text>
  <text x="256" y="596" font-size="18" font-weight="600" fill="#9fc0ff">8 families</text>
  <text x="410" y="596" font-size="18" font-weight="600" fill="#ffffff">10,337 tests</text>
  <text x="556" y="596" font-size="18" font-weight="600" fill="#9fc0ff">read-only</text>
  <text x="1118" y="596" font-size="15" fill="#8fb2f2" text-anchor="end" letter-spacing="1.5">SFS-E28-FEX</text>
</svg>
