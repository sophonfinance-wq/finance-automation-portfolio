<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" role="img" aria-label="Depreciation and Prepaid Amortization engine tile: every register and prepaid figure re-derived from cost, life, convention and the stated window through one schedule kernel, and the register totals tied to the GL control accounts and the posted recurring entry.">
  <defs>
    <pattern id="grid-dep" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#eef2f8" stroke-width="1"/></pattern>
    <marker id="arw-dep" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1200" height="675" fill="#f6f8fb"/><rect width="1200" height="675" fill="url(#grid-dep)"/>
  <rect x="16" y="16" width="1168" height="643" rx="18" fill="#ffffff" stroke="#e3e9f2" stroke-width="1.5"/>
  <text x="56" y="86" font-size="40" font-weight="700" fill="#0f2a5c">Depreciation &amp; Prepaid Amortization</text>
  <text x="58" y="120" font-size="19" fill="#5b6b84" letter-spacing="0.5">SFS-E36-DEP &#183; does every derived figure re-derive from cost, life and window, and do the totals tie?</text>
  <rect x="1020" y="52" width="128" height="34" rx="17" fill="#eaf1ff" stroke="#c9dcff"/><text x="1084" y="75" font-size="15" font-weight="600" fill="#2563eb" text-anchor="middle">READ-ONLY</text>

  <!-- base facts + kernel -->
  <rect x="56" y="238" width="210" height="150" rx="14" fill="#0f2a5c"/>
  <text x="161" y="272" font-size="16" fill="#9fc0ff" text-anchor="middle">BASE FACTS</text>
  <text x="161" y="302" font-size="15" fill="#ffffff" text-anchor="middle">cost &#183; class &#183; life</text>
  <text x="161" y="324" font-size="15" fill="#ffffff" text-anchor="middle">in-service month</text>
  <text x="161" y="360" font-size="13" fill="#8fb2f2" text-anchor="middle">one schedule kernel</text>

  <path d="M266 313H360" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-dep)"/>
  <text x="313" y="303" font-size="13" fill="#5b6b84" text-anchor="middle">re-derives</text>

  <!-- register + prepaid re-derivation -->
  <rect x="372" y="176" width="470" height="286" rx="14" fill="#ffffff" stroke="#c9dcff" stroke-width="1.5"/>
  <text x="392" y="208" font-size="16" font-weight="700" fill="#0f2a5c">Register &amp; prepaid &#183; cost &#247; life</text>
  <g font-size="15.5" fill="#0f2a5c">
    <circle cx="404" cy="240" r="8" fill="#15803d"/><text x="424" y="245">Monthly charge = cost &#247; life (integer cents)</text>
    <circle cx="404" cy="274" r="8" fill="#15803d"/><text x="424" y="279">Accumulated = base &#215; months-used, capped at cost</text>
    <circle cx="404" cy="308" r="8" fill="#15803d"/><text x="424" y="313">NBV = cost &#8722; accumulated, inside [0, cost]</text>
    <circle cx="404" cy="342" r="8" fill="#15803d"/><text x="424" y="347">Prepaid waterfall &#183; first month takes the catch-up</text>
    <circle cx="404" cy="376" r="8" fill="#15803d"/><text x="424" y="381">Roll-forwards close and foot their registers</text>
    <circle cx="404" cy="410" r="8" fill="#c0392b"/><text x="424" y="415" fill="#c0392b">One life keyed off the class table &#8212; off-convention</text>
    <circle cx="404" cy="444" r="8" fill="#c8912f"/><text x="424" y="449" fill="#c8912f">One asset stale past its end month &#8212; disposal review</text>
  </g>

  <!-- tie-out -->
  <rect x="866" y="238" width="278" height="150" rx="14" fill="#ffffff" stroke="#c9dcff" stroke-width="1.5"/>
  <text x="1005" y="270" font-size="15" font-weight="700" fill="#0f2a5c" text-anchor="middle">GL &amp; recurring entry</text>
  <g font-size="13.5" fill="#5b6b84">
    <text x="886" y="300">1610 cost &#183; 1611 accum &#183; 1420 prepaid</text>
    <text x="886" y="324">JE-DEP &#183; JE-AMORT posted from the schedule</text>
    <text x="886" y="348" fill="#c0392b">one control account off the register &#8212; variance</text>
    <text x="886" y="372">tie the register footings with exact ==</text>
  </g>
  <path d="M842 313H860" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-dep)"/>

  <!-- verdict -->
  <rect x="866" y="404" width="278" height="86" rx="14" fill="#fdf7ec" stroke="#eecfa3" stroke-width="1.5"/>
  <text x="1005" y="438" font-size="17" fill="#c8912f" text-anchor="middle">verdict: REVIEW</text>
  <text x="1005" y="466" font-size="13.5" fill="#5b6b84" text-anchor="middle">figures re-derive, totals tie &#8212;</text>
  <text x="1005" y="484" font-size="13.5" fill="#5b6b84" text-anchor="middle">a stale asset is due for disposal review</text>

  <rect x="56" y="560" width="1088" height="58" rx="14" fill="#0f2a5c"/>
  <text x="82" y="596" font-size="18" font-weight="600" fill="#ffffff">30 controls</text>
  <text x="256" y="596" font-size="18" font-weight="600" fill="#9fc0ff">11 families</text>
  <text x="420" y="596" font-size="18" font-weight="600" fill="#ffffff">440 tests</text>
  <text x="566" y="596" font-size="18" font-weight="600" fill="#9fc0ff">read-only</text>
  <text x="1118" y="596" font-size="15" fill="#8fb2f2" text-anchor="end" letter-spacing="1.5">SFS-E36-DEP</text>
</svg>
