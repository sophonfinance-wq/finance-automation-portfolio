<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" role="img" aria-label="Project Proforma Integrity engine tile: each project's proforma re-derived from its base ledger and held to the tie-out registry -- balances, cost budgets, the profit and owner-repayment waterfall chain, margins and the reporting calendar.">
  <defs>
    <pattern id="grid-qpr" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#eef2f8" stroke-width="1"/></pattern>
    <marker id="arw-qpr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1200" height="675" fill="#f6f8fb"/><rect width="1200" height="675" fill="url(#grid-qpr)"/>
  <rect x="16" y="16" width="1168" height="643" rx="18" fill="#ffffff" stroke="#e3e9f2" stroke-width="1.5"/>
  <text x="56" y="86" font-size="40" font-weight="700" fill="#0f2a5c">Project Proforma Integrity</text>
  <text x="58" y="120" font-size="19" fill="#5b6b84" letter-spacing="0.5">SFS-E23-QPR &#183; does the workbook still tie to itself?</text>
  <rect x="1020" y="52" width="128" height="34" rx="17" fill="#eaf1ff" stroke="#c9dcff"/><text x="1084" y="75" font-size="15" font-weight="600" fill="#2563eb" text-anchor="middle">READ-ONLY</text>

  <!-- base ledger -->
  <rect x="56" y="238" width="204" height="150" rx="14" fill="#0f2a5c"/>
  <text x="158" y="278" font-size="17" fill="#9fc0ff" text-anchor="middle">BASE LEDGER</text>
  <text x="158" y="312" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle">Brightwater</text>
  <g font-size="13" fill="#8fb2f2" text-anchor="middle">
    <text x="158" y="340">hard + soft &#183; interest</text>
    <text x="158" y="360">revenue &#183; area &#183; split</text>
    <text x="158" y="380">prior &#183; milestone dates</text>
  </g>

  <path d="M260 313H360" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-qpr)"/>
  <text x="310" y="301" font-size="13" fill="#5b6b84" text-anchor="middle">re-derived</text>
  <text x="310" y="335" font-size="13" fill="#5b6b84" text-anchor="middle">to the cent</text>

  <!-- tie-out registry -->
  <rect x="372" y="180" width="470" height="266" rx="14" fill="#ffffff" stroke="#c9dcff" stroke-width="1.5"/>
  <text x="392" y="212" font-size="16" font-weight="700" fill="#0f2a5c">Tie-out registry</text>
  <g font-size="15.5" fill="#0f2a5c">
    <circle cx="404" cy="244" r="8" fill="#15803d"/><text x="424" y="249">Cost budgets tie: hard+soft, unlevered, contingency</text>
    <circle cx="404" cy="278" r="8" fill="#15803d"/><text x="424" y="283">Interest reserve covers interest &#183; equity funded first</text>
    <circle cx="404" cy="312" r="8" fill="#15803d"/><text x="424" y="317">Profit chain &amp; waterfall close on the whole</text>
    <circle cx="404" cy="346" r="8" fill="#15803d"/><text x="424" y="351">Splits sum to net profit &#183; margins re-derive</text>
    <circle cx="404" cy="380" r="8" fill="#15803d"/><text x="424" y="385">Variance = current &#8722; prior</text>
    <circle cx="404" cy="414" r="8" fill="#c0392b"/><text x="424" y="419" fill="#c0392b">Uses exceed sources by 1&#162; &#8212; source &amp; use error</text>
  </g>

  <!-- calendar + verdict -->
  <rect x="866" y="180" width="278" height="130" rx="14" fill="#ffffff" stroke="#c9dcff" stroke-width="1.5"/>
  <text x="886" y="210" font-size="16" font-weight="700" fill="#0f2a5c">Reporting calendar</text>
  <g font-size="14" fill="#5b6b84">
    <circle cx="896" cy="238" r="7" fill="#15803d"/><text x="912" y="243">Marran QPR &#183; filed on time</text>
    <circle cx="896" cy="266" r="7" fill="#15803d"/><text x="912" y="271">Deck complete: MU, apts, acq</text>
    <circle cx="896" cy="294" r="7" fill="#c8912f"/><text x="912" y="299" fill="#c8912f">Kelder QPR &#183; 1 day late</text>
  </g>

  <rect x="866" y="326" width="278" height="120" rx="14" fill="#fdf7ec" stroke="#eecfa3" stroke-width="1.5"/>
  <text x="1005" y="368" font-size="17" fill="#c8912f" text-anchor="middle">verdict: FAIL</text>
  <text x="1005" y="398" font-size="14" fill="#5b6b84" text-anchor="middle">the error-check tab reads zero &#8212;</text>
  <text x="1005" y="420" font-size="14" fill="#5b6b84" text-anchor="middle">the balance re-derives to a cent off</text>

  <rect x="56" y="560" width="1088" height="58" rx="14" fill="#0f2a5c"/>
  <text x="82" y="596" font-size="18" font-weight="600" fill="#ffffff">26 controls</text>
  <text x="256" y="596" font-size="18" font-weight="600" fill="#9fc0ff">9 families</text>
  <text x="410" y="596" font-size="18" font-weight="600" fill="#ffffff">10,381 tests</text>
  <text x="556" y="596" font-size="18" font-weight="600" fill="#9fc0ff">tie-outs to the cent</text>
  <text x="1118" y="596" font-size="15" fill="#8fb2f2" text-anchor="end" letter-spacing="1.5">SOPHON FINANCE SYSTEMS</text>
</svg>
