<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" role="img" aria-label="Project Variance and Business-Plan Compare engine tile: every derived figure recomputed from its own inputs, each variance column re-footed as the difference of the two columns beside it, both comparative columns proved to foot inside themselves, and the plan column proved against the frozen approved version.">
  <defs>
    <pattern id="grid-pvr" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#eef2f8" stroke-width="1"/></pattern>
    <marker id="arw-pvr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1200" height="675" fill="#f6f8fb"/><rect width="1200" height="675" fill="url(#grid-pvr)"/>
  <rect x="16" y="16" width="1168" height="643" rx="18" fill="#ffffff" stroke="#e3e9f2" stroke-width="1.5"/>
  <text x="56" y="86" font-size="40" font-weight="700" fill="#0f2a5c">Project Variance &amp; Business-Plan Compare</text>
  <text x="58" y="120" font-size="19" fill="#5b6b84" letter-spacing="0.5">SFS-E45-PVR &#183; does the variance column still equal the two columns beside it?</text>
  <rect x="1020" y="52" width="128" height="34" rx="17" fill="#eaf1ff" stroke="#c9dcff"/><text x="1084" y="75" font-size="15" font-weight="600" fill="#2563eb" text-anchor="middle">READ-ONLY</text>

  <!-- the project report under test -->
  <rect x="56" y="180" width="214" height="140" rx="14" fill="#0f2a5c"/>
  <text x="163" y="214" font-size="15" fill="#9fc0ff" text-anchor="middle">PROJECT REPORT</text>
  <text x="163" y="248" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">PRJ-301</text>
  <text x="163" y="274" font-size="13" fill="#8fb2f2" text-anchor="middle">for-sale residential &#183; FY2029-Q3</text>
  <text x="163" y="298" font-size="13" fill="#8fb2f2" text-anchor="middle">Current &#183; Prior &#183; Business Plan</text>

  <rect x="56" y="342" width="214" height="118" rx="14" fill="#ffffff" stroke="#c9dcff" stroke-width="1.5"/>
  <text x="163" y="374" font-size="15" font-weight="700" fill="#0f2a5c" text-anchor="middle">BUDGET VARIANCE TAB</text>
  <text x="163" y="402" font-size="13.5" fill="#5b6b84" text-anchor="middle">Total Budget &#183; Cost to Date</text>
  <text x="163" y="428" font-size="13.5" fill="#5b6b84" text-anchor="middle">Cost to Complete is the remainder</text>
  <text x="163" y="450" font-size="12.5" fill="#8794aa" text-anchor="middle">never a column maintained beside it</text>

  <path d="M270 250H366" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-pvr)"/>
  <text x="318" y="238" font-size="13" fill="#5b6b84" text-anchor="middle">restated</text>
  <path d="M270 400H340L340 300H366" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-pvr)"/>
  <text x="318" y="418" font-size="13" fill="#5b6b84" text-anchor="middle">foots expense</text>

  <!-- restatement kernel -->
  <rect x="378" y="164" width="418" height="326" rx="14" fill="#ffffff" stroke="#c9dcff" stroke-width="1.5"/>
  <text x="398" y="196" font-size="16" font-weight="700" fill="#0f2a5c">Restatement &#183; measured to period FY2029-Q3</text>
  <g font-size="15" fill="#0f2a5c">
    <circle cx="410" cy="228" r="8" fill="#15803d"/><text x="430" y="233">Cost to Complete = Total Budget less Cost to Date</text>
    <circle cx="410" cy="262" r="8" fill="#15803d"/><text x="430" y="267">Net revenue, profit, margin from their own inputs</text>
    <circle cx="410" cy="296" r="8" fill="#15803d"/><text x="430" y="301">Variance = current less the column measured to</text>
    <circle cx="410" cy="330" r="8" fill="#15803d"/><text x="430" y="335">Milestone variance = comparison less current, + is ahead</text>
    <circle cx="410" cy="364" r="8" fill="#c8912f"/><text x="430" y="369" fill="#c8912f">6 days behind &#8212; past the 5-day schedule tolerance</text>
    <circle cx="410" cy="398" r="8" fill="#c0392b"/><text x="430" y="403" fill="#c0392b">A variance column that no longer foots its neighbours</text>
    <circle cx="410" cy="432" r="8" fill="#c0392b"/><text x="430" y="437" fill="#c0392b">A plan column re-based to a revision nobody approved</text>
  </g>
  <text x="398" y="470" font-size="12.5" fill="#8794aa">margin truncates toward zero &#183; integer cents and bps, exact ==</text>

  <path d="M796 250H872" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-pvr)"/>
  <path d="M796 400H872" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-pvr)"/>

  <!-- frozen plan + rollup -->
  <rect x="884" y="188" width="260" height="124" rx="14" fill="#fdf7ec" stroke="#eecfa3" stroke-width="1.5"/>
  <text x="1014" y="222" font-size="15" font-weight="700" fill="#c8912f" text-anchor="middle">FROZEN BASELINES</text>
  <text x="1014" y="252" font-size="13.5" fill="#5b6b84" text-anchor="middle">plan version BP-2028-R2 and</text>
  <text x="1014" y="274" font-size="13.5" fill="#5b6b84" text-anchor="middle">schedule SCH-2028-R2 proved on</text>
  <text x="1014" y="296" font-size="13.5" fill="#5b6b84" text-anchor="middle">every project &#8212; never re-based</text>

  <rect x="884" y="338" width="260" height="124" rx="14" fill="#eaf1ff" stroke="#c9dcff" stroke-width="1.5"/>
  <text x="1014" y="372" font-size="15" font-weight="700" fill="#2563eb" text-anchor="middle">REPORT ROLLUP</text>
  <text x="1014" y="402" font-size="13.5" fill="#5b6b84" text-anchor="middle">project count and all four totals</text>
  <text x="1014" y="424" font-size="13.5" fill="#5b6b84" text-anchor="middle">re-summed across every current</text>
  <text x="1014" y="446" font-size="13.5" fill="#5b6b84" text-anchor="middle">period row, never maintained</text>

  <rect x="56" y="560" width="1088" height="58" rx="14" fill="#0f2a5c"/>
  <text x="82" y="596" font-size="18" font-weight="600" fill="#ffffff">22 controls</text>
  <text x="256" y="596" font-size="18" font-weight="600" fill="#9fc0ff">7 families</text>
  <text x="410" y="596" font-size="18" font-weight="600" fill="#ffffff">10,407 tests</text>
  <text x="592" y="596" font-size="18" font-weight="600" fill="#9fc0ff">read-only</text>
  <text x="1118" y="596" font-size="15" fill="#8fb2f2" text-anchor="end" letter-spacing="1.5">SFS-E45-PVR</text>
</svg>
