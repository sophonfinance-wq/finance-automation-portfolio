<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" role="img" aria-label="Subcontract SOV and change-order engine tile: every schedule of values footed to its contract, the revised commitment moved only on approved change orders, every pay-app column re-derived, and the conditional release tied to the certified payment due.">
  <defs>
    <pattern id="grid-sov" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#eef2f8" stroke-width="1"/></pattern>
    <marker id="arw-sov" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1200" height="675" fill="#f6f8fb"/><rect width="1200" height="675" fill="url(#grid-sov)"/>
  <rect x="16" y="16" width="1168" height="643" rx="18" fill="#ffffff" stroke="#e3e9f2" stroke-width="1.5"/>
  <text x="56" y="86" font-size="40" font-weight="700" fill="#0f2a5c">Subcontract SOV &amp; Change Orders</text>
  <text x="58" y="120" font-size="19" fill="#5b6b84" letter-spacing="0.5">SFS-E34-SOV &#183; did the contract move only on approved paper, and does every billed figure re-derive?</text>
  <rect x="1020" y="52" width="128" height="34" rx="17" fill="#eaf1ff" stroke="#c9dcff"/><text x="1084" y="75" font-size="15" font-weight="600" fill="#2563eb" text-anchor="middle">READ-ONLY</text>

  <!-- commitment + schedule of values -->
  <rect x="56" y="196" width="216" height="150" rx="14" fill="#0f2a5c"/>
  <text x="164" y="234" font-size="15" fill="#9fc0ff" text-anchor="middle">COMMITMENT</text>
  <text x="164" y="264" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">BWC-KETT00-1</text>
  <text x="164" y="292" font-size="13" fill="#8fb2f2" text-anchor="middle">original contract $485,000</text>
  <text x="164" y="320" font-size="13" fill="#8fb2f2" text-anchor="middle">SOV lines foot exactly</text>

  <path d="M272 271H360" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-sov)"/>
  <text x="316" y="259" font-size="13" fill="#5b6b84" text-anchor="middle">amended</text>
  <text x="316" y="293" font-size="13" fill="#5b6b84" text-anchor="middle">by CO log</text>

  <!-- change-order gate -->
  <rect x="372" y="150" width="470" height="150" rx="14" fill="#ffffff" stroke="#c9dcff" stroke-width="1.5"/>
  <text x="392" y="182" font-size="16" font-weight="700" fill="#0f2a5c">Change orders &#183; revised = original + net approved</text>
  <g font-size="15" fill="#0f2a5c">
    <circle cx="404" cy="212" r="8" fill="#15803d"/><text x="424" y="217">Approved order #-1 moves the revised contract</text>
    <circle cx="404" cy="244" r="8" fill="#c8912f"/><text x="424" y="249" fill="#c8912f">Pending order moves nothing until approved</text>
    <circle cx="404" cy="276" r="8" fill="#15803d"/><text x="424" y="281">Soft-cost credit routed as #-N, not a new commitment</text>
  </g>

  <!-- pay application chain -->
  <rect x="372" y="322" width="470" height="204" rx="14" fill="#ffffff" stroke="#c9dcff" stroke-width="1.5"/>
  <text x="392" y="354" font-size="16" font-weight="700" fill="#0f2a5c">Pay application &#183; every column re-derives</text>
  <g font-size="15" fill="#0f2a5c">
    <circle cx="404" cy="386" r="8" fill="#15803d"/><text x="424" y="391">Completed = previously billed + this period</text>
    <circle cx="404" cy="418" r="8" fill="#c0392b"/><text x="424" y="423" fill="#c0392b">One line billed past its scheduled value &#8212; overbilled</text>
    <circle cx="404" cy="450" r="8" fill="#15803d"/><text x="424" y="455">Retention at the contract rate on the request</text>
    <circle cx="404" cy="482" r="8" fill="#15803d"/><text x="424" y="487">Payment due = request &#8722; retention + sales tax</text>
    <circle cx="404" cy="514" r="8" fill="#15803d"/><text x="424" y="519">Header foots &#183; sequence rolls forward 1..N</text>
  </g>

  <path d="M842 424H930" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-sov)"/>
  <text x="886" y="412" font-size="13" fill="#5b6b84" text-anchor="middle">ties</text>

  <!-- conditional release + verdict -->
  <rect x="866" y="342" width="278" height="98" rx="14" fill="#eef4ff" stroke="#c9dcff" stroke-width="1.5"/>
  <text x="1005" y="378" font-size="15" fill="#2563eb" text-anchor="middle">CONDITIONAL RELEASE</text>
  <text x="1005" y="406" font-size="14" fill="#5b6b84" text-anchor="middle">signed for the certified</text>
  <text x="1005" y="426" font-size="14" fill="#5b6b84" text-anchor="middle">payment due, exactly once</text>

  <rect x="866" y="452" width="278" height="74" rx="14" fill="#fdecec" stroke="#eeb8b8" stroke-width="1.5"/>
  <text x="1005" y="486" font-size="17" fill="#c0392b" text-anchor="middle">verdict: FAIL</text>
  <text x="1005" y="510" font-size="13" fill="#5b6b84" text-anchor="middle">one line bills past its schedule</text>

  <rect x="56" y="560" width="1088" height="58" rx="14" fill="#0f2a5c"/>
  <text x="82" y="596" font-size="18" font-weight="600" fill="#ffffff">29 controls</text>
  <text x="256" y="596" font-size="18" font-weight="600" fill="#9fc0ff">11 families</text>
  <text x="420" y="596" font-size="18" font-weight="600" fill="#ffffff">412 tests</text>
  <text x="566" y="596" font-size="18" font-weight="600" fill="#9fc0ff">read-only</text>
  <text x="1118" y="596" font-size="15" fill="#8fb2f2" text-anchor="end" letter-spacing="1.5">SFS-E34-SOV</text>
</svg>
