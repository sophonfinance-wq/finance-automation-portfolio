<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" role="img" aria-label="Information Return Issuance engine tile: every box amount footed back to the payment lines it came from, a form proved to exist exactly where the threshold or the withholding override obliges one, backup withholding recomputed at the statutory rate in both directions, and every transmittal recounted from the forms behind it.">
  <defs>
    <pattern id="grid-irn" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#eef2f8" stroke-width="1"/></pattern>
    <marker id="arw-irn" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1200" height="675" fill="#f6f8fb"/><rect width="1200" height="675" fill="url(#grid-irn)"/>
  <rect x="16" y="16" width="1168" height="643" rx="18" fill="#ffffff" stroke="#e3e9f2" stroke-width="1.5"/>
  <text x="56" y="86" font-size="40" font-weight="700" fill="#0f2a5c">Information Return Issuance</text>
  <text x="58" y="120" font-size="19" fill="#5b6b84" letter-spacing="0.5">SFS-E47-IRN &#183; was a form issued exactly where one was owed, and does every box foot?</text>
  <rect x="1020" y="52" width="128" height="34" rx="17" fill="#eaf1ff" stroke="#c9dcff"/><text x="1084" y="75" font-size="15" font-weight="600" fill="#2563eb" text-anchor="middle">READ-ONLY</text>

  <!-- the form under test -->
  <rect x="56" y="180" width="214" height="140" rx="14" fill="#0f2a5c"/>
  <text x="163" y="214" font-size="15" fill="#9fc0ff" text-anchor="middle">FORM REGISTER</text>
  <text x="163" y="248" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">FRM-403-02</text>
  <text x="163" y="274" font-size="13" fill="#8fb2f2" text-anchor="middle">ENT-403 &#183; PYE-503 &#183; box NB-1</text>
  <text x="163" y="298" font-size="13" fill="#8fb2f2" text-anchor="middle">750.00 &#183; exactly the threshold</text>

  <rect x="56" y="342" width="214" height="118" rx="14" fill="#ffffff" stroke="#c9dcff" stroke-width="1.5"/>
  <text x="163" y="374" font-size="15" font-weight="700" fill="#0f2a5c" text-anchor="middle">LEDGER EXTRACT</text>
  <text x="163" y="402" font-size="13.5" fill="#5b6b84" text-anchor="middle">every payment line in the year</text>
  <text x="163" y="428" font-size="13.5" fill="#5b6b84" text-anchor="middle">the box is footed from these</text>
  <text x="163" y="450" font-size="12.5" fill="#8794aa" text-anchor="middle">never re-keyed from a summary</text>

  <path d="M270 250H366" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-irn)"/>
  <text x="318" y="238" font-size="13" fill="#5b6b84" text-anchor="middle">issued</text>
  <path d="M270 400H340L340 300H366" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-irn)"/>
  <text x="318" y="418" font-size="13" fill="#5b6b84" text-anchor="middle">foots the box</text>

  <!-- issuance kernel -->
  <rect x="378" y="164" width="418" height="326" rx="14" fill="#ffffff" stroke="#c9dcff" stroke-width="1.5"/>
  <text x="398" y="196" font-size="16" font-weight="700" fill="#0f2a5c">Issuance &#183; the reporting year carried in the file</text>
  <g font-size="15" fill="#0f2a5c">
    <circle cx="410" cy="228" r="8" fill="#15803d"/><text x="430" y="233">Box amount = the entity's own payment lines, summed</text>
    <circle cx="410" cy="262" r="8" fill="#15803d"/><text x="430" y="267">Threshold met at the cent obliges a return</text>
    <circle cx="410" cy="296" r="8" fill="#15803d"/><text x="430" y="301">No number on file: withheld tax obliges one anyway</text>
    <circle cx="410" cy="330" r="8" fill="#15803d"/><text x="430" y="335">Withholding = statutory rate, or exactly zero</text>
    <circle cx="410" cy="364" r="8" fill="#c8912f"/><text x="430" y="369" fill="#c8912f">50.00 short &#8212; inside the review band, no form owed</text>
    <circle cx="410" cy="398" r="8" fill="#c0392b"/><text x="430" y="403" fill="#c0392b">Cleared a threshold and was never cut a form</text>
    <circle cx="410" cy="432" r="8" fill="#c0392b"/><text x="430" y="437" fill="#c0392b">A form issued to a payee who was not reportable</text>
  </g>
  <text x="398" y="470" font-size="12.5" fill="#8794aa">one predicate, both directions &#183; integer cents, exact ==</text>

  <path d="M796 250H872" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-irn)"/>
  <path d="M796 400H872" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-irn)"/>

  <!-- withholding + transmittal -->
  <rect x="884" y="188" width="260" height="124" rx="14" fill="#fdf7ec" stroke="#eecfa3" stroke-width="1.5"/>
  <text x="1014" y="222" font-size="15" font-weight="700" fill="#c8912f" text-anchor="middle">BACKUP WITHHOLDING</text>
  <text x="1014" y="252" font-size="13.5" fill="#5b6b84" text-anchor="middle">missing tax is the group's own</text>
  <text x="1014" y="274" font-size="13.5" fill="#5b6b84" text-anchor="middle">liability; tax taken anyway is the</text>
  <text x="1014" y="296" font-size="13.5" fill="#5b6b84" text-anchor="middle">payee's money held without cause</text>

  <rect x="884" y="338" width="260" height="124" rx="14" fill="#eaf1ff" stroke="#c9dcff" stroke-width="1.5"/>
  <text x="1014" y="372" font-size="15" font-weight="700" fill="#2563eb" text-anchor="middle">TRANSMITTAL &amp; ROLLUP</text>
  <text x="1014" y="402" font-size="13.5" fill="#5b6b84" text-anchor="middle">the one page read before the</text>
  <text x="1014" y="424" font-size="13.5" fill="#5b6b84" text-anchor="middle">forms: count and both totals</text>
  <text x="1014" y="446" font-size="13.5" fill="#5b6b84" text-anchor="middle">re-struck from the register</text>

  <rect x="56" y="560" width="1088" height="58" rx="14" fill="#0f2a5c"/>
  <text x="82" y="596" font-size="18" font-weight="600" fill="#ffffff">22 controls</text>
  <text x="256" y="596" font-size="18" font-weight="600" fill="#9fc0ff">9 families</text>
  <text x="410" y="596" font-size="18" font-weight="600" fill="#ffffff">10,382 tests</text>
  <text x="592" y="596" font-size="18" font-weight="600" fill="#9fc0ff">read-only</text>
  <text x="1118" y="596" font-size="15" fill="#8fb2f2" text-anchor="end" letter-spacing="1.5">SFS-E47-IRN</text>
</svg>
