<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" role="img" aria-label="Lien Waiver Tracking engine tile: each cleared payment covered by a waiver through its paid-through date, conditional waivers converting to unconditional, lower tiers waived, unwaived exposure re-derived.">
  <defs>
    <pattern id="grid-lwv" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#eef2f8" stroke-width="1"/></pattern>
    <marker id="arw-lwv" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1200" height="675" fill="#f6f8fb"/><rect width="1200" height="675" fill="url(#grid-lwv)"/>
  <rect x="16" y="16" width="1168" height="643" rx="18" fill="#ffffff" stroke="#e3e9f2" stroke-width="1.5"/>
  <text x="56" y="86" font-size="40" font-weight="700" fill="#0f2a5c">Lien Waiver Tracking</text>
  <text x="58" y="120" font-size="19" fill="#5b6b84" letter-spacing="0.5">SFS-E21-LWV &#183; no lien survives the payment</text>
  <rect x="1020" y="52" width="128" height="34" rx="17" fill="#eaf1ff" stroke="#c9dcff"/><text x="1084" y="75" font-size="15" font-weight="600" fill="#2563eb" text-anchor="middle">READ-ONLY</text>

  <!-- payment -->
  <rect x="56" y="252" width="196" height="116" rx="14" fill="#0f2a5c"/>
  <text x="154" y="292" font-size="16" fill="#9fc0ff" text-anchor="middle">PROGRESS PAYMENT</text>
  <text x="154" y="326" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">$318,000</text>
  <text x="154" y="352" font-size="13" fill="#8fb2f2" text-anchor="middle">paid through 04-30</text>

  <path d="M252 310H352" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-lwv)"/>
  <text x="302" y="298" font-size="12.5" fill="#5b6b84" text-anchor="middle">covered by</text>

  <!-- waiver progression -->
  <rect x="358" y="240" width="230" height="140" rx="14" fill="#fdf7ec" stroke="#eecfa3" stroke-width="1.5"/>
  <text x="378" y="272" font-size="16" font-weight="700" fill="#0f2a5c">Conditional waiver</text>
  <text x="378" y="300" font-size="14" fill="#c8912f">through 04-30 &#183; on payment clearing</text>
  <path d="M473 340V366" fill="none" stroke="#2f6b4f" stroke-width="2.2" marker-end="url(#arw-lwv)"/>
  <text x="490" y="356" font-size="13" fill="#2f6b4f">clears &#8594;</text>

  <rect x="358" y="392" width="230" height="52" rx="12" fill="#eef7f1" stroke="#bfe0cc" stroke-width="1.5"/>
  <text x="378" y="424" font-size="15" font-weight="600" fill="#2f6b4f">Unconditional &#10003; through 04-30</text>

  <!-- tiers + exposure -->
  <rect x="612" y="240" width="270" height="204" rx="14" fill="#ffffff" stroke="#c9dcff" stroke-width="1.5"/>
  <text x="632" y="272" font-size="16" font-weight="700" fill="#0f2a5c">Lower tiers</text>
  <g font-size="14.5" fill="#5b6b84">
    <circle cx="642" cy="300" r="7" fill="#15803d"/><text x="658" y="305">Framing supplier waived</text>
    <circle cx="642" cy="330" r="7" fill="#15803d"/><text x="658" y="335">Concrete sub waived</text>
    <circle cx="642" cy="360" r="7" fill="#c0392b"/><text x="658" y="365" fill="#c0392b">Electrical tier-2 unwaived</text>
  </g>
  <text x="632" y="404" font-size="14.5" fill="#0f2a5c" font-weight="700">unwaived exposure re-derived</text>
  <text x="632" y="428" font-size="14" fill="#c0392b">$41,500 a title company will not close over</text>

  <rect x="906" y="252" width="238" height="120" rx="14" fill="#0f2a5c"/>
  <text x="1025" y="292" font-size="15" fill="#9fc0ff" text-anchor="middle">WAIVER LOG</text>
  <text x="1025" y="326" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">covered = paid</text>
  <text x="1025" y="352" font-size="13" fill="#8fb2f2" text-anchor="middle">every cleared payment reconciled</text>

  <rect x="56" y="560" width="1088" height="58" rx="14" fill="#0f2a5c"/>
  <text x="82" y="596" font-size="18" font-weight="600" fill="#ffffff">25 controls</text>
  <text x="256" y="596" font-size="18" font-weight="600" fill="#9fc0ff">8 families</text>
  <text x="410" y="596" font-size="18" font-weight="600" fill="#ffffff">10,373 tests</text>
  <text x="556" y="596" font-size="18" font-weight="600" fill="#9fc0ff">through-date to the day</text>
  <text x="1118" y="596" font-size="15" fill="#8fb2f2" text-anchor="end" letter-spacing="1.5">SOPHON FINANCE SYSTEMS</text>
</svg>
