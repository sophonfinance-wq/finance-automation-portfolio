<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" role="img" aria-label="Payroll &amp; Benefit Reconciliation engine tile: every benefit deduction the register withheld proved to reach each provider, the ledger liability and cash in the same amount, the employer match recomputed and every statutory limit held.">
  <defs>
    <pattern id="grid-pbr" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#eef2f8" stroke-width="1"/></pattern>
    <marker id="arw-pbr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1200" height="675" fill="#f6f8fb"/><rect width="1200" height="675" fill="url(#grid-pbr)"/>
  <rect x="16" y="16" width="1168" height="643" rx="18" fill="#ffffff" stroke="#e3e9f2" stroke-width="1.5"/>
  <text x="56" y="86" font-size="40" font-weight="700" fill="#0f2a5c">Payroll &amp; Benefit Reconciliation</text>
  <text x="58" y="120" font-size="18" fill="#5b6b84" letter-spacing="0.3">SFS-E30-PBR &#183; did every benefit dollar reach the provider, the ledger and cash intact?</text>
  <rect x="1020" y="52" width="128" height="34" rx="17" fill="#eaf1ff" stroke="#c9dcff"/><text x="1084" y="75" font-size="15" font-weight="600" fill="#2563eb" text-anchor="middle">READ-ONLY</text>

  <!-- payroll register source -->
  <rect x="56" y="272" width="196" height="118" rx="14" fill="#0f2a5c"/>
  <text x="154" y="312" font-size="15" fill="#9fc0ff" text-anchor="middle">PAYROLL REGISTER</text>
  <text x="154" y="344" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">EMP-01 &#183; P-401K</text>
  <text x="154" y="370" font-size="14" fill="#8fb2f2" text-anchor="middle">deducted $900.00</text>

  <!-- fan-out to four destinations -->
  <path d="M252 300C300 300 300 214 356 214" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arw-pbr)"/>
  <path d="M252 320C300 320 300 286 356 286" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arw-pbr)"/>
  <path d="M252 342C300 342 300 358 356 358" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arw-pbr)"/>
  <path d="M252 362C300 362 300 430 356 430" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arw-pbr)"/>

  <g font-size="14.5" fill="#0f2a5c">
    <rect x="360" y="192" width="234" height="44" rx="10" fill="#ffffff" stroke="#c9dcff" stroke-width="1.4"/><text x="376" y="219">Recordkeeper upload &#8212; $900.00</text>
    <rect x="360" y="264" width="234" height="44" rx="10" fill="#ffffff" stroke="#eecfa3" stroke-width="1.4"/><text x="376" y="291" fill="#c8912f">Custodian upload &#8212; missed</text>
    <rect x="360" y="336" width="234" height="44" rx="10" fill="#ffffff" stroke="#c9dcff" stroke-width="1.4"/><text x="376" y="363">Ledger liability &#8212; $900.00</text>
    <rect x="360" y="408" width="234" height="44" rx="10" fill="#ffffff" stroke="#c9dcff" stroke-width="1.4"/><text x="376" y="435">Cash transfer &#8212; $900.00</text>
  </g>

  <!-- tie-out + gates panel -->
  <path d="M594 322H648" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-pbr)"/>
  <rect x="656" y="196" width="330" height="252" rx="14" fill="#ffffff" stroke="#c9dcff" stroke-width="1.5"/>
  <text x="676" y="228" font-size="16" font-weight="700" fill="#0f2a5c">Recompute &amp; tie-out (exact ==)</text>
  <g font-size="13.5" fill="#0f2a5c">
    <circle cx="686" cy="260" r="7.5" fill="#15803d"/><text x="705" y="265">Register ties recordkeeper, ledger, cash</text>
    <circle cx="686" cy="294" r="7.5" fill="#c0392b"/><text x="705" y="299" fill="#c0392b">Custodian leg missed &#8212; not reconciled</text>
    <circle cx="686" cy="328" r="7.5" fill="#15803d"/><text x="705" y="333">Employer match recomputes from formula</text>
    <circle cx="686" cy="362" r="7.5" fill="#15803d"/><text x="705" y="367">YTD deferral under the 402(g) ceiling</text>
    <circle cx="686" cy="396" r="7.5" fill="#15803d"/><text x="705" y="401">Deposit inside the DOL safe harbor</text>
    <circle cx="686" cy="430" r="7.5" fill="#c8912f"/><text x="705" y="435" fill="#c8912f">One deferral inside the watch band</text>
  </g>

  <!-- verdict -->
  <path d="M986 322H1030" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-pbr)"/>
  <rect x="1038" y="256" width="112" height="132" rx="14" fill="#fdf7ec" stroke="#eecfa3" stroke-width="1.5"/>
  <text x="1094" y="300" font-size="15" fill="#c8912f" text-anchor="middle">verdict</text>
  <text x="1094" y="326" font-size="19" font-weight="700" fill="#c8912f" text-anchor="middle">FAIL</text>
  <text x="1094" y="356" font-size="12.5" fill="#5b6b84" text-anchor="middle">custodian</text>
  <text x="1094" y="372" font-size="12.5" fill="#5b6b84" text-anchor="middle">leg missed</text>

  <rect x="56" y="560" width="1088" height="58" rx="14" fill="#0f2a5c"/>
  <text x="82" y="596" font-size="18" font-weight="600" fill="#ffffff">29 controls</text>
  <text x="256" y="596" font-size="18" font-weight="600" fill="#9fc0ff">12 families</text>
  <text x="420" y="596" font-size="18" font-weight="600" fill="#ffffff">10,414 tests</text>
  <text x="566" y="596" font-size="18" font-weight="600" fill="#9fc0ff">read-only</text>
  <text x="1118" y="596" font-size="15" fill="#8fb2f2" text-anchor="end" letter-spacing="1.5">SFS-E30-PBR</text>
</svg>
