<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" role="img" aria-label="Expense and P-Card engine tile: a bank statement reconciled line-by-line to an expense report, each charge needing a receipt, tying to the cent.">
  <defs>
    <pattern id="grid-exp" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#eef2f8" stroke-width="1"/></pattern>
    <marker id="arw-exp" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1200" height="675" fill="#f6f8fb"/><rect width="1200" height="675" fill="url(#grid-exp)"/>
  <rect x="16" y="16" width="1168" height="643" rx="18" fill="#ffffff" stroke="#e3e9f2" stroke-width="1.5"/>
  <text x="56" y="86" font-size="40" font-weight="700" fill="#0f2a5c">Expense &amp; P-Card</text>
  <text x="58" y="120" font-size="19" fill="#5b6b84" letter-spacing="0.5">SFS-E19-EXP &#183; every charge, a receipt</text>
  <rect x="1020" y="52" width="128" height="34" rx="17" fill="#eaf1ff" stroke="#c9dcff"/><text x="1084" y="75" font-size="15" font-weight="600" fill="#2563eb" text-anchor="middle">READ-ONLY</text>

  <!-- statement -->
  <rect x="56" y="196" width="300" height="252" rx="14" fill="#ffffff" stroke="#c9dcff" stroke-width="1.5"/>
  <text x="76" y="228" font-size="16" font-weight="700" fill="#0f2a5c">Bank statement</text>
  <g font-size="14.5" fill="#5b6b84" font-family="'Consolas',monospace">
    <text x="76" y="262">04-03  Harborview Air   214.80</text>
    <text x="76" y="292">04-08  Cedar Supply     88.15</text>
    <text x="76" y="322">04-11  Grovewell Hotel  402.00</text>
    <text x="76" y="352">04-19  Pinehollow Fuel  61.40</text>
    <text x="76" y="392" fill="#0f2a5c" font-weight="700">total        766.35</text>
  </g>

  <!-- reconciliation -->
  <g stroke="#2563eb" stroke-width="2.2">
    <path d="M356 262H500" fill="none" marker-end="url(#arw-exp)"/>
    <path d="M356 292H500" fill="none" marker-end="url(#arw-exp)"/>
    <path d="M356 322H500" fill="none" marker-end="url(#arw-exp)"/>
    <path d="M356 352H500" fill="none" marker-end="url(#arw-exp)"/>
  </g>
  <text x="428" y="188" font-size="13" fill="#5b6b84" text-anchor="middle">reconcile</text>

  <!-- report -->
  <rect x="506" y="196" width="360" height="252" rx="14" fill="#ffffff" stroke="#c9dcff" stroke-width="1.5"/>
  <text x="526" y="228" font-size="16" font-weight="700" fill="#0f2a5c">Expense report</text>
  <g font-size="14.5" fill="#5b6b84">
    <circle cx="536" cy="257" r="7" fill="#15803d"/><text x="552" y="262">214.80 &#183; 60-410 &#183; site visit &#183; receipt</text>
    <circle cx="536" cy="287" r="7" fill="#15803d"/><text x="552" y="292">88.15 &#183; 60-420 &#183; job supplies &#183; receipt</text>
    <circle cx="536" cy="317" r="7" fill="#c0392b"/><text x="552" y="322" fill="#c0392b">402.00 &#183; no receipt on file</text>
    <circle cx="536" cy="347" r="7" fill="#15803d"/><text x="552" y="352">61.40 &#183; 60-430 &#183; fuel &#183; receipt</text>
    <text x="526" y="392" fill="#0f2a5c" font-weight="700">total        766.35</text>
  </g>

  <!-- tie-out -->
  <rect x="880" y="250" width="264" height="120" rx="14" fill="#eef7f1" stroke="#bfe0cc" stroke-width="1.5"/>
  <text x="1012" y="290" font-size="17" fill="#2f6b4f" text-anchor="middle">report ties statement</text>
  <text x="1012" y="322" font-size="26" font-weight="700" fill="#15803d" text-anchor="middle">766.35 &#10003;</text>
  <text x="1012" y="348" font-size="13.5" fill="#c0392b" text-anchor="middle">one line still missing its receipt</text>

  <rect x="56" y="560" width="1088" height="58" rx="14" fill="#0f2a5c"/>
  <text x="82" y="596" font-size="18" font-weight="600" fill="#ffffff">23 controls</text>
  <text x="256" y="596" font-size="18" font-weight="600" fill="#9fc0ff">8 families</text>
  <text x="410" y="596" font-size="18" font-weight="600" fill="#ffffff">346 tests</text>
  <text x="556" y="596" font-size="18" font-weight="600" fill="#9fc0ff">reconciled to the cent</text>
  <text x="1118" y="596" font-size="15" fill="#8fb2f2" text-anchor="end" letter-spacing="1.5">SOPHON FINANCE SYSTEMS</text>
</svg>
