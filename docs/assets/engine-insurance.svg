<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" role="img" aria-label="Insurance Cost Allocation engine tile: one master programme premium apportioned across three project job-cost cards and summing back to the premium.">
  <defs>
    <pattern id="grid-ins" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#eef2f8" stroke-width="1"/>
    </pattern>
    <marker id="arw-ins" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#f6f8fb"/>
  <rect width="1200" height="675" fill="url(#grid-ins)"/>
  <rect x="16" y="16" width="1168" height="643" rx="18" fill="#ffffff" stroke="#e3e9f2" stroke-width="1.5"/>

  <!-- header -->
  <text x="56" y="86" font-size="40" font-weight="700" fill="#0f2a5c">Insurance Cost Allocation</text>
  <text x="58" y="120" font-size="19" fill="#5b6b84" letter-spacing="0.5">SFS-E17-INS &#183; one premium, many projects</text>
  <rect x="1020" y="52" width="128" height="34" rx="17" fill="#eaf1ff" stroke="#c9dcff"/>
  <text x="1084" y="75" font-size="15" font-weight="600" fill="#2563eb" text-anchor="middle">READ-ONLY</text>

  <!-- premium source -->
  <rect x="56" y="250" width="196" height="120" rx="14" fill="#0f2a5c"/>
  <text x="154" y="298" font-size="17" fill="#9fc0ff" text-anchor="middle">MASTER PREMIUM</text>
  <text x="154" y="332" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">$636,000</text>
  <text x="154" y="356" font-size="13" fill="#8fb2f2" text-anchor="middle">GL &#183; excess &#183; builder&#8217;s risk</text>

  <!-- allocation lines -->
  <path d="M252 285H360" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-ins)"/>
  <path d="M252 310H360" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-ins)"/>
  <path d="M252 335H360" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-ins)"/>
  <text x="300" y="250" font-size="13" fill="#5b6b84" text-anchor="middle">by declared basis</text>

  <!-- project cards -->
  <g>
    <rect x="372" y="196" width="250" height="66" rx="12" fill="#ffffff" stroke="#c9dcff" stroke-width="1.5"/>
    <text x="392" y="228" font-size="17" font-weight="600" fill="#0f2a5c">Brightwater Commons</text>
    <text x="392" y="250" font-size="14" fill="#5b6b84">hard-cost basis</text>
    <text x="602" y="238" font-size="19" font-weight="700" fill="#2563eb" text-anchor="end">$268,301</text>

    <rect x="372" y="278" width="250" height="66" rx="12" fill="#ffffff" stroke="#c9dcff" stroke-width="1.5"/>
    <text x="392" y="310" font-size="17" font-weight="600" fill="#0f2a5c">Copperfield Yards</text>
    <text x="392" y="332" font-size="14" fill="#5b6b84">hard-cost basis</text>
    <text x="602" y="320" font-size="19" font-weight="700" fill="#2563eb" text-anchor="end">$201,226</text>

    <rect x="372" y="360" width="250" height="66" rx="12" fill="#ffffff" stroke="#c9dcff" stroke-width="1.5"/>
    <text x="392" y="392" font-size="17" font-weight="600" fill="#0f2a5c">Alderpoint Terraces</text>
    <text x="392" y="414" font-size="14" fill="#5b6b84">hard-cost basis</text>
    <text x="602" y="402" font-size="19" font-weight="700" fill="#2563eb" text-anchor="end">$166,473</text>
  </g>

  <!-- tie-out -->
  <path d="M622 229H720" fill="none" stroke="#5b6b84" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M622 311H720" fill="none" stroke="#5b6b84" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M622 393H720" fill="none" stroke="#5b6b84" stroke-width="2" stroke-dasharray="4 4"/>
  <rect x="726" y="250" width="240" height="120" rx="14" fill="#eef7f1" stroke="#bfe0cc" stroke-width="1.5"/>
  <text x="846" y="292" font-size="17" fill="#2f6b4f" text-anchor="middle">&#931; shares = premium</text>
  <text x="846" y="330" font-size="30" font-weight="700" fill="#15803d" text-anchor="middle">$636,000.00</text>
  <text x="846" y="356" font-size="14" fill="#2f6b4f" text-anchor="middle">re-derived to the cent &#10003;</text>

  <!-- families note -->
  <text x="1000" y="256" font-size="14" fill="#5b6b84" text-anchor="middle">set &#183; pol &#183; alloc</text>
  <text x="1000" y="280" font-size="14" fill="#5b6b84" text-anchor="middle">br &#183; aud &#183; gl &#183; rpt</text>

  <!-- footer strip -->
  <rect x="56" y="560" width="1088" height="58" rx="14" fill="#0f2a5c"/>
  <text x="82" y="596" font-size="18" font-weight="600" fill="#ffffff">24 controls</text>
  <text x="256" y="596" font-size="18" font-weight="600" fill="#9fc0ff">7 families</text>
  <text x="410" y="596" font-size="18" font-weight="600" fill="#ffffff">364 tests</text>
  <text x="556" y="596" font-size="18" font-weight="600" fill="#9fc0ff">0 tolerance</text>
  <text x="1118" y="596" font-size="15" fill="#8fb2f2" text-anchor="end" letter-spacing="1.5">SOPHON FINANCE SYSTEMS</text>
</svg>
