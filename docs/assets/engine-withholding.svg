<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" role="img" aria-label="Non-Resident Withholding &amp; 1042-S engine tile: every cross-border FDAP payment rated from the payee's status in the order FATCA override, portfolio exemption, treaty rate behind a valid W-8, then statutory, with the deposits and the Form 1042 tied to the 1042-S slips.">
  <defs>
    <pattern id="grid-nrw" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#eef2f8" stroke-width="1"/></pattern>
    <marker id="arw-nrw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1200" height="675" fill="#f6f8fb"/><rect width="1200" height="675" fill="url(#grid-nrw)"/>
  <rect x="16" y="16" width="1168" height="643" rx="18" fill="#ffffff" stroke="#e3e9f2" stroke-width="1.5"/>
  <text x="56" y="86" font-size="40" font-weight="700" fill="#0f2a5c">Non-Resident Withholding &amp; 1042-S</text>
  <text x="58" y="120" font-size="19" fill="#5b6b84" letter-spacing="0.5">SFS-E31-NRW &#183; does each cross-border rate recompute, and does the 1042 tie to the slips?</text>
  <rect x="1020" y="52" width="128" height="34" rx="17" fill="#eaf1ff" stroke="#c9dcff"/><text x="1084" y="75" font-size="15" font-weight="600" fill="#2563eb" text-anchor="middle">READ-ONLY</text>

  <!-- payee register -->
  <rect x="56" y="250" width="204" height="122" rx="14" fill="#0f2a5c"/>
  <text x="158" y="292" font-size="16" fill="#9fc0ff" text-anchor="middle">FOREIGN PAYEE</text>
  <text x="158" y="326" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle">PAYEE-04</text>
  <text x="158" y="352" font-size="13" fill="#8fb2f2" text-anchor="middle">Ch.3/4 status &#183; Form W-8</text>

  <path d="M260 311H360" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-nrw)"/>
  <text x="310" y="299" font-size="13" fill="#5b6b84" text-anchor="middle">rated by</text>
  <text x="310" y="333" font-size="13" fill="#5b6b84" text-anchor="middle">precedence</text>

  <!-- determination -->
  <rect x="372" y="196" width="470" height="252" rx="14" fill="#ffffff" stroke="#c9dcff" stroke-width="1.5"/>
  <text x="392" y="228" font-size="16" font-weight="700" fill="#0f2a5c">Rate determination &#183; tax = rate &#215; gross</text>
  <g font-size="15.5" fill="#0f2a5c">
    <circle cx="404" cy="260" r="8" fill="#15803d"/><text x="424" y="265">FATCA override &#8594; statutory 30.00%</text>
    <circle cx="404" cy="294" r="8" fill="#15803d"/><text x="424" y="299">Portfolio interest, non-contingent &#8594; 0%</text>
    <circle cx="404" cy="328" r="8" fill="#15803d"/><text x="424" y="333">Treaty rate behind a valid unexpired W-8</text>
    <circle cx="404" cy="362" r="8" fill="#15803d"/><text x="424" y="367">Everything else &#8594; statutory default</text>
    <circle cx="404" cy="396" r="8" fill="#c0392b"/><text x="424" y="401" fill="#c0392b">One reduced rate carries no valid W-8</text>
    <circle cx="404" cy="430" r="8" fill="#c8912f"/><text x="424" y="435" fill="#c8912f">One W-8 is inside the renewal window &#8212; refresh</text>
  </g>

  <!-- verdict -->
  <rect x="866" y="250" width="278" height="122" rx="14" fill="#fdf7ec" stroke="#eecfa3" stroke-width="1.5"/>
  <text x="1005" y="292" font-size="17" fill="#c8912f" text-anchor="middle">verdict: REVIEW</text>
  <text x="1005" y="322" font-size="14" fill="#5b6b84" text-anchor="middle">1042 ties the slips, deposits tie &#8212;</text>
  <text x="1005" y="344" font-size="14" fill="#5b6b84" text-anchor="middle">a valid W-8 is due for renewal</text>

  <rect x="56" y="560" width="1088" height="58" rx="14" fill="#0f2a5c"/>
  <text x="82" y="596" font-size="18" font-weight="600" fill="#ffffff">28 controls</text>
  <text x="256" y="596" font-size="18" font-weight="600" fill="#9fc0ff">8 families</text>
  <text x="410" y="596" font-size="18" font-weight="600" fill="#ffffff">410 tests</text>
  <text x="556" y="596" font-size="18" font-weight="600" fill="#9fc0ff">read-only</text>
  <text x="1118" y="596" font-size="15" fill="#8fb2f2" text-anchor="end" letter-spacing="1.5">SFS-E31-NRW</text>
</svg>
