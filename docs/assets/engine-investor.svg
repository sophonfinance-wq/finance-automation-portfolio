<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="JV Investor Reporting Package engine tile: an isometric line drawing of a monthly reporting package drawn as three exploded statement sheets. Five source slabs at the left converge on a single node and feed the stack. On the top sheet a cobalt path runs across one row through the member columns into the Total column. Below the stack a dashed boundary marks the released print area, with a tie-out check row struck out beneath it. At the right a closed gate holds the package, and the partner's copy waits beyond it drawn dashed and unissued.">
  <title>JV Investor Reporting Package</title>
  <defs>
    <style>
      .ink { fill: none; stroke: #2b3038; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: #2b3038; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
      .hair { fill: none; stroke: #9aa3ad; stroke-width: 1; stroke-linecap: round; }
      .face { fill: #eef1f4; }
      .face-2 { fill: #e3e7ec; }
      .face-3 { fill: #d6dbe2; }
      .accent { fill: none; stroke: #0f62fe; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
      .accent-thin { fill: none; stroke: #0f62fe; stroke-width: 1.6; stroke-linecap: round; }
      .accent-fill { fill: #0f62fe; }
      .dash { stroke-dasharray: 9 8; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>

  <!-- ============ five sources entering at the left ============ -->
  <!-- project ledger extract -->
  <path class="face-2" d="M 110 230 L 230 194 L 230 270 L 110 306 Z"/>
  <path class="ink" d="M 110 230 L 230 194 L 230 270 L 110 306 Z"/>
  <path class="hair" d="M 110 255 L 230 219"/>
  <path class="hair" d="M 110 280 L 230 244"/>
  <!-- job cost detail by division -->
  <path class="face-2" d="M 110 326 L 230 290 L 230 366 L 110 402 Z"/>
  <path class="ink" d="M 110 326 L 230 290 L 230 366 L 110 402 Z"/>
  <path class="hair" d="M 110 351 L 230 315"/>
  <path class="hair" d="M 110 376 L 230 340"/>
  <!-- executed equity draw schedule -->
  <path class="face-2" d="M 110 422 L 230 386 L 230 462 L 110 498 Z"/>
  <path class="ink" d="M 110 422 L 230 386 L 230 462 L 110 498 Z"/>
  <path class="hair" d="M 110 447 L 230 411"/>
  <path class="hair" d="M 110 472 L 230 436"/>
  <!-- parent ledger, carrying the reciprocal investment -->
  <path class="face-2" d="M 110 518 L 230 482 L 230 558 L 110 594 Z"/>
  <path class="ink" d="M 110 518 L 230 482 L 230 558 L 110 594 Z"/>
  <path class="hair" d="M 110 543 L 230 507"/>
  <path class="hair" d="M 110 568 L 230 532"/>
  <!-- the package issued for the period before -->
  <path class="face-2" d="M 110 614 L 230 578 L 230 654 L 110 690 Z"/>
  <path class="ink" d="M 110 614 L 230 578 L 230 654 L 110 690 Z"/>
  <path class="hair" d="M 110 639 L 230 603"/>
  <path class="hair" d="M 110 664 L 230 628"/>

  <!-- the five converge on one node -->
  <path class="thin" d="M 238 232 L 548 418"/>
  <path class="thin" d="M 238 328 L 548 419"/>
  <path class="thin" d="M 238 424 L 548 420"/>
  <path class="thin" d="M 238 520 L 548 421"/>
  <path class="thin" d="M 238 616 L 548 422"/>
  <circle class="face" cx="556" cy="420" r="14"/>
  <circle class="ink" cx="556" cy="420" r="14"/>
  <path class="accent" d="M 572 419 L 604 411"/>
  <path class="accent-fill" d="M 616 409 L 600 419 L 597 408 Z"/>

  <!-- ============ the package: three exploded statement sheets ============ -->
  <!-- bottom sheet -->
  <path class="face-3" d="M 620 470 L 1020 350 L 1310 451 L 910 571 Z"/>
  <path class="ink" d="M 620 470 L 1020 350 L 1310 451 L 910 571 Z"/>
  <path class="face-3" d="M 620 470 L 910 571 L 910 585 L 620 484 Z"/>
  <path class="ink" d="M 620 470 L 910 571 L 910 585 L 620 484 Z"/>
  <path class="face-3" d="M 910 571 L 1310 451 L 1310 465 L 910 585 Z"/>
  <path class="ink" d="M 910 571 L 1310 451 L 1310 465 L 910 585 Z"/>

  <!-- middle sheet -->
  <path class="face-2" d="M 620 400 L 1020 280 L 1310 381 L 910 501 Z"/>
  <path class="ink" d="M 620 400 L 1020 280 L 1310 381 L 910 501 Z"/>
  <path class="face-2" d="M 620 400 L 910 501 L 910 515 L 620 414 Z"/>
  <path class="ink" d="M 620 400 L 910 501 L 910 515 L 620 414 Z"/>
  <path class="face-2" d="M 910 501 L 1310 381 L 1310 395 L 910 515 Z"/>
  <path class="ink" d="M 910 501 L 1310 381 L 1310 395 L 910 515 Z"/>

  <!-- top sheet: the statement of members' capital -->
  <path class="face" d="M 620 330 L 1020 210 L 1310 311 L 910 431 Z"/>
  <path class="ink" d="M 620 330 L 1020 210 L 1310 311 L 910 431 Z"/>
  <path class="face" d="M 620 330 L 910 431 L 910 445 L 620 344 Z"/>
  <path class="ink" d="M 620 330 L 910 431 L 910 445 L 620 344 Z"/>
  <path class="face" d="M 910 431 L 1310 311 L 1310 325 L 910 445 Z"/>
  <path class="ink" d="M 910 431 L 1310 311 L 1310 325 L 910 445 Z"/>

  <!-- member columns, then the Total column at the right -->
  <path class="thin" d="M 720 300 L 1010 401"/>
  <path class="thin" d="M 820 270 L 1110 371"/>
  <path class="thin" d="M 920 240 L 1210 341"/>
  <!-- rows -->
  <path class="hair" d="M 716 363 L 1116 243"/>
  <path class="hair" d="M 811 397 L 1211 277"/>

  <!-- the Total column cross-foots the member columns on the row it sits on -->
  <path class="accent-thin" d="M 815 366 L 915 336 L 1015 306 L 1099 281"/>
  <circle class="accent-fill" cx="815" cy="366" r="5"/>
  <circle class="accent-fill" cx="915" cy="336" r="5"/>
  <circle class="accent-fill" cx="1015" cy="306" r="5"/>
  <path class="accent-fill" d="M 1118 275 L 1101 288 L 1097 274 Z"/>

  <!-- ============ the released print area, and what stays out of it ============ -->
  <path class="thin dash" d="M 620 676 L 1240 676"/>
  <!-- the internal tie-out check row, excluded -->
  <path class="face-3" d="M 720 712 L 1040 712 L 1040 762 L 720 762 Z"/>
  <path class="thin dash" d="M 720 712 L 1040 712 L 1040 762 L 720 762 Z"/>
  <path class="hair" d="M 800 712 L 800 762"/>
  <path class="hair" d="M 880 712 L 880 762"/>
  <path class="hair" d="M 960 712 L 960 762"/>
  <circle class="face" cx="660" cy="737" r="25"/>
  <circle class="ink" cx="660" cy="737" r="25"/>
  <path class="ink" d="M 649 726 L 671 748"/>
  <path class="ink" d="M 671 726 L 649 748"/>

  <!-- ============ the release gate, closed ============ -->
  <path class="accent" d="M 1318 388 L 1350 405"/>
  <path class="accent-thin" d="M 1356 394 L 1356 420"/>

  <path class="face-2" d="M 1362 330 L 1378 330 L 1378 560 L 1362 560 Z"/>
  <path class="ink" d="M 1362 330 L 1378 330 L 1378 560 L 1362 560 Z"/>
  <path class="face-2" d="M 1484 330 L 1500 330 L 1500 560 L 1484 560 Z"/>
  <path class="ink" d="M 1484 330 L 1500 330 L 1500 560 L 1484 560 Z"/>
  <path class="accent" d="M 1378 425 L 1484 425"/>
  <circle class="face" cx="1431" cy="425" r="16"/>
  <circle class="ink" cx="1431" cy="425" r="16"/>
  <path class="accent-thin" d="M 1431 417 L 1431 433"/>

  <!-- the partner's copy, not yet issued -->
  <path class="thin dash" d="M 1516 390 L 1576 372 L 1576 486 L 1516 504 Z"/>
</svg>
