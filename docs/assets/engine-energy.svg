<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" role="img" aria-label="Energy-Efficient Home Credit engine tile: each claimed dwelling gated on its close-of-escrow date and RESNET/HERS certification, the gross credit re-derived as qualifying units times the dated statutory per-unit rate.">
  <defs>
    <pattern id="grid-eeh" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#eef2f8" stroke-width="1"/></pattern>
    <marker id="arw-eeh" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1200" height="675" fill="#f6f8fb"/><rect width="1200" height="675" fill="url(#grid-eeh)"/>
  <rect x="16" y="16" width="1168" height="643" rx="18" fill="#ffffff" stroke="#e3e9f2" stroke-width="1.5"/>
  <text x="56" y="86" font-size="40" font-weight="700" fill="#0f2a5c">Energy-Efficient Home Credit</text>
  <text x="58" y="120" font-size="19" fill="#5b6b84" letter-spacing="0.5">SFS-E26-EEH &#183; did the unit close in the period, and was it certified?</text>
  <rect x="1020" y="52" width="128" height="34" rx="17" fill="#eaf1ff" stroke="#c9dcff"/><text x="1084" y="75" font-size="15" font-weight="600" fill="#2563eb" text-anchor="middle">READ-ONLY</text>

  <!-- dwelling unit -->
  <rect x="56" y="250" width="204" height="122" rx="14" fill="#0f2a5c"/>
  <text x="158" y="292" font-size="16" fill="#9fc0ff" text-anchor="middle">DWELLING UNIT</text>
  <text x="158" y="326" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle">UNIT-A04</text>
  <text x="158" y="352" font-size="13" fill="#8fb2f2" text-anchor="middle">closed &#183; HERS certificate</text>

  <path d="M260 311H360" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-eeh)"/>
  <text x="310" y="299" font-size="13" fill="#5b6b84" text-anchor="middle">gated on</text>
  <text x="310" y="333" font-size="13" fill="#5b6b84" text-anchor="middle">two dates</text>

  <!-- eligibility gates -->
  <rect x="372" y="196" width="470" height="252" rx="14" fill="#ffffff" stroke="#c9dcff" stroke-width="1.5"/>
  <text x="392" y="228" font-size="16" font-weight="700" fill="#0f2a5c">Per-unit gates &#183; units &#215; $2,000</text>
  <g font-size="15.5" fill="#0f2a5c">
    <circle cx="404" cy="260" r="8" fill="#15803d"/><text x="424" y="265">Closed in FY window 07/01 &#8211; 06/30</text>
    <circle cx="404" cy="294" r="8" fill="#15803d"/><text x="424" y="299">On or before statutory sunset (&#8804;)</text>
    <circle cx="404" cy="328" r="8" fill="#15803d"/><text x="424" y="333">RESNET/HERS certified, rater named</text>
    <circle cx="404" cy="362" r="8" fill="#15803d"/><text x="424" y="367">Claimed once &#8212; no prior-filing overlap</text>
    <circle cx="404" cy="396" r="8" fill="#c0392b"/><text x="424" y="401" fill="#c0392b">One unit closed past the sunset &#8212; earns nothing</text>
    <circle cx="404" cy="430" r="8" fill="#c8912f"/><text x="424" y="435" fill="#c8912f">One project closed more than certified &#8212; gap to chase</text>
  </g>

  <!-- verdict -->
  <rect x="866" y="250" width="278" height="122" rx="14" fill="#fdf7ec" stroke="#eecfa3" stroke-width="1.5"/>
  <text x="1005" y="292" font-size="17" fill="#c8912f" text-anchor="middle">verdict: REVIEW</text>
  <text x="1005" y="322" font-size="14" fill="#5b6b84" text-anchor="middle">gross credit re-derives, report ties &#8212;</text>
  <text x="1005" y="344" font-size="14" fill="#5b6b84" text-anchor="middle">a closed unit was never certified</text>

  <rect x="56" y="560" width="1088" height="58" rx="14" fill="#0f2a5c"/>
  <text x="82" y="596" font-size="18" font-weight="600" fill="#ffffff">26 controls</text>
  <text x="256" y="596" font-size="18" font-weight="600" fill="#9fc0ff">12 families</text>
  <text x="420" y="596" font-size="18" font-weight="600" fill="#ffffff">390 tests</text>
  <text x="566" y="596" font-size="18" font-weight="600" fill="#9fc0ff">read-only</text>
  <text x="1118" y="596" font-size="15" fill="#8fb2f2" text-anchor="end" letter-spacing="1.5">SFS-E26-EEH</text>
</svg>
