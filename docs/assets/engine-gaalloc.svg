<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" role="img" aria-label="G&amp;A Expense Allocation engine tile: a holding entity's monthly cost pool split across operating entities and projects on driver counts, with every share, allocated amount and journal entry re-derived from the tab beneath it and compared to the cent.">
  <defs>
    <pattern id="grid-gaa" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#eef2f8" stroke-width="1"/></pattern>
    <marker id="arw-gaa" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1200" height="675" fill="#f6f8fb"/><rect width="1200" height="675" fill="url(#grid-gaa)"/>
  <rect x="16" y="16" width="1168" height="643" rx="18" fill="#ffffff" stroke="#e3e9f2" stroke-width="1.5"/>
  <text x="56" y="86" font-size="40" font-weight="700" fill="#0f2a5c">G&amp;A Expense Allocation</text>
  <text x="58" y="120" font-size="19" fill="#5b6b84" letter-spacing="0.5">SFS-E43-GAA &#183; did the whole pool leave the holding entity, and land where the drivers say?</text>
  <rect x="1020" y="52" width="128" height="34" rx="17" fill="#eaf1ff" stroke="#c9dcff"/><text x="1084" y="75" font-size="15" font-weight="600" fill="#2563eb" text-anchor="middle">READ-ONLY</text>

  <!-- the holding entity's monthly cost pool -->
  <rect x="56" y="232" width="204" height="126" rx="14" fill="#0f2a5c"/>
  <text x="158" y="270" font-size="15" fill="#9fc0ff" text-anchor="middle">HOLDING ENTITY POOL</text>
  <text x="158" y="306" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">$286,881.40</text>
  <text x="158" y="330" font-size="13" fill="#8fb2f2" text-anchor="middle">2031-04 &#183; overhead + G&amp;A</text>
  <text x="158" y="348" font-size="13" fill="#8fb2f2" text-anchor="middle">+ metered postage</text>

  <path d="M260 295H360" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-gaa)"/>
  <text x="310" y="283" font-size="13" fill="#5b6b84" text-anchor="middle">split on</text>
  <text x="310" y="317" font-size="13" fill="#5b6b84" text-anchor="middle">drivers</text>

  <!-- the monthly re-derivation -->
  <rect x="372" y="170" width="470" height="250" rx="14" fill="#ffffff" stroke="#c9dcff" stroke-width="1.5"/>
  <text x="392" y="202" font-size="16" font-weight="700" fill="#0f2a5c">Per-month re-derivation &#183; pool &#215; driver share</text>
  <g font-size="15.5" fill="#0f2a5c">
    <circle cx="404" cy="234" r="8" fill="#15803d"/><text x="424" y="239">Shares sum to exactly 10,000 bps (100.00%)</text>
    <circle cx="404" cy="268" r="8" fill="#15803d"/><text x="424" y="273">Every share re-derives from the driver counts</text>
    <circle cx="404" cy="302" r="8" fill="#15803d"/><text x="424" y="307">Allocated column ties the pool to the cent</text>
    <circle cx="404" cy="336" r="8" fill="#15803d"/><text x="424" y="341">Entry balances and nets to zero at consolidation</text>
    <circle cx="404" cy="370" r="8" fill="#c0392b"/><text x="424" y="375" fill="#c0392b">Two amounts transposed &#8212; cost on the wrong books</text>
    <circle cx="404" cy="404" r="8" fill="#c8912f"/><text x="424" y="409" fill="#c8912f">Pool stepped 13.94% against a 5.00% band</text>
  </g>

  <!-- verdict -->
  <rect x="866" y="232" width="278" height="126" rx="14" fill="#fdf1f0" stroke="#eec4bf" stroke-width="1.5"/>
  <text x="1005" y="272" font-size="17" fill="#c0392b" text-anchor="middle">verdict: FAIL</text>
  <text x="1005" y="302" font-size="14" fill="#5b6b84" text-anchor="middle">the column still ties the pool &#8212;</text>
  <text x="1005" y="324" font-size="14" fill="#5b6b84" text-anchor="middle">only re-deriving each recipient</text>
  <text x="1005" y="346" font-size="14" fill="#5b6b84" text-anchor="middle">shows where the cost landed</text>

  <!-- recipients: 2031-04 driver counts to re-derived shares -->
  <text x="56" y="452" font-size="14" fill="#5b6b84">2031-04 driver counts &#8594; shares, largest remainder, summing to 10,000 bps</text>
  <g font-size="13">
    <rect x="56" y="464" width="168" height="58" rx="12" fill="#f6f8fb" stroke="#e3e9f2"/><text x="140" y="489" font-weight="700" fill="#0f2a5c" text-anchor="middle">ENT-201</text><text x="140" y="509" fill="#5b6b84" text-anchor="middle">44 hc &#183; 31.43%</text>
    <rect x="240" y="464" width="168" height="58" rx="12" fill="#f6f8fb" stroke="#e3e9f2"/><text x="324" y="489" font-weight="700" fill="#0f2a5c" text-anchor="middle">ENT-202</text><text x="324" y="509" fill="#5b6b84" text-anchor="middle">33 hc &#183; 23.57%</text>
    <rect x="424" y="464" width="168" height="58" rx="12" fill="#f6f8fb" stroke="#e3e9f2"/><text x="508" y="489" font-weight="700" fill="#0f2a5c" text-anchor="middle">ENT-203</text><text x="508" y="509" fill="#5b6b84" text-anchor="middle">26 hc &#183; 18.57%</text>
    <rect x="608" y="464" width="168" height="58" rx="12" fill="#f6f8fb" stroke="#e3e9f2"/><text x="692" y="489" font-weight="700" fill="#0f2a5c" text-anchor="middle">ENT-204</text><text x="692" y="509" fill="#5b6b84" text-anchor="middle">19 hc &#183; 13.57%</text>
    <rect x="792" y="464" width="168" height="58" rx="12" fill="#f6f8fb" stroke="#e3e9f2"/><text x="876" y="489" font-weight="700" fill="#0f2a5c" text-anchor="middle">PRJ-301</text><text x="876" y="509" fill="#5b6b84" text-anchor="middle">10 hc &#183; 7.14%</text>
    <rect x="976" y="464" width="168" height="58" rx="12" fill="#f6f8fb" stroke="#e3e9f2"/><text x="1060" y="489" font-weight="700" fill="#0f2a5c" text-anchor="middle">PRJ-302</text><text x="1060" y="509" fill="#5b6b84" text-anchor="middle">8 hc &#183; 5.72%</text>
  </g>

  <rect x="56" y="560" width="1088" height="58" rx="14" fill="#0f2a5c"/>
  <text x="82" y="596" font-size="18" font-weight="600" fill="#ffffff">22 controls</text>
  <text x="256" y="596" font-size="18" font-weight="600" fill="#9fc0ff">9 families</text>
  <text x="420" y="596" font-size="18" font-weight="600" fill="#ffffff">10,404 tests</text>
  <text x="600" y="596" font-size="18" font-weight="600" fill="#9fc0ff">read-only</text>
  <text x="1118" y="596" font-size="15" fill="#8fb2f2" text-anchor="end" letter-spacing="1.5">SFS-E43-GAA</text>
</svg>
