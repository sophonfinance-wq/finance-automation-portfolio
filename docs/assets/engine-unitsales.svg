<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" role="img" aria-label="Unit Sales and Commission Tie-Out engine tile: every Matrix row's revenue per square foot, net proceeds and total commission re-derived from the prices beside them, the Commission Log splits tied to the total the Matrix authorised, and the Sold/Close tab reconciled in both directions.">
  <defs>
    <pattern id="grid-usm" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#eef2f8" stroke-width="1"/></pattern>
    <marker id="arw-usm" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1200" height="675" fill="#f6f8fb"/><rect width="1200" height="675" fill="url(#grid-usm)"/>
  <rect x="16" y="16" width="1168" height="643" rx="18" fill="#ffffff" stroke="#e3e9f2" stroke-width="1.5"/>
  <text x="56" y="86" font-size="40" font-weight="700" fill="#0f2a5c">Unit Sales &amp; Commission Tie-Out</text>
  <text x="58" y="120" font-size="19" fill="#5b6b84" letter-spacing="0.5">SFS-E42-USM &#183; does the Matrix still tie to the tabs that feed it?</text>
  <rect x="1020" y="52" width="128" height="34" rx="17" fill="#eaf1ff" stroke="#c9dcff"/><text x="1084" y="75" font-size="15" font-weight="600" fill="#2563eb" text-anchor="middle">READ-ONLY</text>

  <!-- the Matrix row under test -->
  <rect x="56" y="196" width="204" height="122" rx="14" fill="#0f2a5c"/>
  <text x="158" y="238" font-size="16" fill="#9fc0ff" text-anchor="middle">MATRIX ROW</text>
  <text x="158" y="272" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle">UNIT-105</text>
  <text x="158" y="298" font-size="13" fill="#8fb2f2" text-anchor="middle">PL-C3 &#183; co_broke &#183; sold</text>

  <path d="M260 257H360" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-usm)"/>
  <text x="310" y="245" font-size="13" fill="#5b6b84" text-anchor="middle">re-derived</text>
  <text x="310" y="279" font-size="13" fill="#5b6b84" text-anchor="middle">from the prices</text>

  <!-- the row tie-out -->
  <rect x="372" y="162" width="470" height="270" rx="14" fill="#ffffff" stroke="#c9dcff" stroke-width="1.5"/>
  <text x="392" y="194" font-size="16" font-weight="700" fill="#0f2a5c">Row tie-out &#183; integer cents, exact ==</text>
  <g font-size="15.5" fill="#0f2a5c">
    <circle cx="404" cy="223" r="8" fill="#15803d"/><text x="424" y="228">Rev/SF = sales price &#247; plan sqft (floored)</text>
    <circle cx="404" cy="255" r="8" fill="#15803d"/><text x="424" y="260">Net proceeds = price &#8722; concession &#8722; costs</text>
    <circle cx="404" cy="287" r="8" fill="#15803d"/><text x="424" y="292">Commission = channel rate (bps) &#215; price</text>
    <circle cx="404" cy="319" r="8" fill="#15803d"/><text x="424" y="324">Sold units reconcile both ways to Sold/Close</text>
    <circle cx="404" cy="351" r="8" fill="#c0392b"/><text x="424" y="356" fill="#c0392b">A split is short &#8212; no Matrix row authorised it</text>
    <circle cx="404" cy="383" r="8" fill="#c8912f"/><text x="424" y="388" fill="#c8912f">A closing is due and its proof is not on file</text>
    <circle cx="404" cy="415" r="8" fill="#c8912f"/><text x="424" y="420" fill="#c8912f">A sold unit was discounted past the band</text>
  </g>

  <!-- verdict -->
  <rect x="866" y="196" width="278" height="122" rx="14" fill="#fdeeee" stroke="#edc0c0" stroke-width="1.5"/>
  <text x="1005" y="238" font-size="17" fill="#c0392b" text-anchor="middle">verdict: FAIL</text>
  <text x="1005" y="268" font-size="14" fill="#5b6b84" text-anchor="middle">the derived columns re-derive &#8212;</text>
  <text x="1005" y="290" font-size="14" fill="#5b6b84" text-anchor="middle">the log pays a total the Matrix</text>
  <text x="1005" y="310" font-size="14" fill="#5b6b84" text-anchor="middle">never authorised</text>

  <!-- the tie-out chain -->
  <rect x="56" y="466" width="250" height="66" rx="12" fill="#ffffff" stroke="#c9dcff" stroke-width="1.5"/>
  <text x="181" y="494" font-size="15" font-weight="700" fill="#0f2a5c" text-anchor="middle">Commission Log</text>
  <text x="181" y="516" font-size="13" fill="#5b6b84" text-anchor="middle">splits by named agent, in cents</text>
  <path d="M306 499H396" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-usm)"/>
  <text x="351" y="487" font-size="12.5" fill="#5b6b84" text-anchor="middle">sum to</text>
  <rect x="406" y="466" width="250" height="66" rx="12" fill="#ffffff" stroke="#c9dcff" stroke-width="1.5"/>
  <text x="531" y="494" font-size="15" font-weight="700" fill="#0f2a5c" text-anchor="middle">Matrix commission column</text>
  <text x="531" y="516" font-size="13" fill="#5b6b84" text-anchor="middle">the total each row authorised</text>
  <path d="M656 499H746" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-usm)"/>
  <text x="701" y="487" font-size="12.5" fill="#5b6b84" text-anchor="middle">foots to</text>
  <rect x="756" y="466" width="250" height="66" rx="12" fill="#ffffff" stroke="#c9dcff" stroke-width="1.5"/>
  <text x="881" y="494" font-size="15" font-weight="700" fill="#0f2a5c" text-anchor="middle">Sales rollup</text>
  <text x="881" y="516" font-size="13" fill="#5b6b84" text-anchor="middle">sold count, revenue, commission</text>

  <rect x="56" y="560" width="1088" height="58" rx="14" fill="#0f2a5c"/>
  <text x="82" y="596" font-size="18" font-weight="600" fill="#ffffff">21 controls</text>
  <text x="248" y="596" font-size="18" font-weight="600" fill="#9fc0ff">7 families</text>
  <text x="396" y="596" font-size="18" font-weight="600" fill="#ffffff">10,355 tests</text>
  <text x="576" y="596" font-size="18" font-weight="600" fill="#9fc0ff">read-only</text>
  <text x="1118" y="596" font-size="15" fill="#8fb2f2" text-anchor="end" letter-spacing="1.5">SFS-E42-USM</text>
</svg>
