<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" role="img" aria-label="Outstanding Check Aging and Escheatment engine tile: the outstanding set re-derived from the check register and the void register, aged to the file's own as-of date across six bands, then tied to the escheatment schedule and the bank reconciliation.">
  <defs>
    <pattern id="grid-oca" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#eef2f8" stroke-width="1"/></pattern>
    <marker id="arw-oca" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1200" height="675" fill="#f6f8fb"/><rect width="1200" height="675" fill="url(#grid-oca)"/>
  <rect x="16" y="16" width="1168" height="643" rx="18" fill="#ffffff" stroke="#e3e9f2" stroke-width="1.5"/>
  <text x="56" y="86" font-size="40" font-weight="700" fill="#0f2a5c">Outstanding Check Aging &amp; Escheatment</text>
  <text x="58" y="120" font-size="19" fill="#5b6b84" letter-spacing="0.5">SFS-E44-OCA &#183; of everything issued, what has never cleared, and how old is it now?</text>
  <rect x="1020" y="52" width="128" height="34" rx="17" fill="#eaf1ff" stroke="#c9dcff"/><text x="1084" y="75" font-size="15" font-weight="600" fill="#2563eb" text-anchor="middle">READ-ONLY</text>

  <!-- source registers -->
  <rect x="56" y="180" width="214" height="140" rx="14" fill="#0f2a5c"/>
  <text x="163" y="214" font-size="15" fill="#9fc0ff" text-anchor="middle">CHECK REGISTER</text>
  <text x="163" y="248" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">CHK-4107</text>
  <text x="163" y="274" font-size="13" fill="#8fb2f2" text-anchor="middle">BNK-100 &#183; issued 2029-02-14</text>
  <text x="163" y="298" font-size="13" fill="#8fb2f2" text-anchor="middle">cleared 0.00 &#183; no cleared date</text>

  <rect x="56" y="342" width="214" height="118" rx="14" fill="#ffffff" stroke="#c9dcff" stroke-width="1.5"/>
  <text x="163" y="374" font-size="15" font-weight="700" fill="#0f2a5c" text-anchor="middle">VOID REGISTER</text>
  <text x="163" y="402" font-size="13.5" fill="#5b6b84" text-anchor="middle">voided &#183; zero-dollar &#183; stop-payment</text>
  <text x="163" y="428" font-size="13.5" fill="#5b6b84" text-anchor="middle">reversal must net to zero</text>
  <text x="163" y="450" font-size="12.5" fill="#8794aa" text-anchor="middle">withdrawn is not outstanding</text>

  <path d="M270 250H366" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-oca)"/>
  <text x="318" y="238" font-size="13" fill="#5b6b84" text-anchor="middle">re-derived</text>
  <path d="M270 400H340L340 300H366" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-oca)"/>
  <text x="318" y="418" font-size="13" fill="#5b6b84" text-anchor="middle">suppressed</text>

  <!-- aging kernel -->
  <rect x="378" y="164" width="418" height="326" rx="14" fill="#ffffff" stroke="#c9dcff" stroke-width="1.5"/>
  <text x="398" y="196" font-size="16" font-weight="700" fill="#0f2a5c">Outstanding set &#183; aged to as_of 2029-09-30</text>
  <g font-size="15" fill="#0f2a5c">
    <circle cx="410" cy="228" r="8" fill="#15803d"/><text x="430" y="233">Nothing cleared, no cleared date, not withdrawn</text>
    <circle cx="410" cy="262" r="8" fill="#15803d"/><text x="430" y="267">Age = whole days, check date to as_of</text>
    <circle cx="410" cy="296" r="8" fill="#15803d"/><text x="430" y="301">Bands 0-30 / 31-60 / 61-90 / 91-180 / 181-365 / 366+</text>
    <circle cx="410" cy="330" r="8" fill="#15803d"/><text x="430" y="335">Reconciliation tied to the register, not the schedule</text>
    <circle cx="410" cy="364" r="8" fill="#c8912f"/><text x="430" y="369" fill="#c8912f">228 days &#8212; past the 180-day stale-dating threshold</text>
    <circle cx="410" cy="398" r="8" fill="#c0392b"/><text x="430" y="403" fill="#c0392b">1,349 days &#8212; past dormancy, unclaimed property</text>
    <circle cx="410" cy="432" r="8" fill="#c0392b"/><text x="430" y="437" fill="#c0392b">A withdrawn check still sitting on the schedule</text>
  </g>
  <text x="398" y="470" font-size="12.5" fill="#8794aa">both thresholds crossed strictly &#183; integer cents, exact ==</text>

  <path d="M796 250H872" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-oca)"/>
  <path d="M796 400H872" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-oca)"/>

  <!-- escheatment + reconciliation -->
  <rect x="884" y="188" width="260" height="124" rx="14" fill="#fdf7ec" stroke="#eecfa3" stroke-width="1.5"/>
  <text x="1014" y="222" font-size="15" font-weight="700" fill="#c8912f" text-anchor="middle">ESCHEATMENT SCHEDULE</text>
  <text x="1014" y="252" font-size="13.5" fill="#5b6b84" text-anchor="middle">exactly the dormant items,</text>
  <text x="1014" y="274" font-size="13.5" fill="#5b6b84" text-anchor="middle">each to its account's declared</text>
  <text x="1014" y="296" font-size="13.5" fill="#5b6b84" text-anchor="middle">jurisdiction &#8212; never another's</text>

  <rect x="884" y="338" width="260" height="124" rx="14" fill="#eaf1ff" stroke="#c9dcff" stroke-width="1.5"/>
  <text x="1014" y="372" font-size="15" font-weight="700" fill="#2563eb" text-anchor="middle">BANK RECONCILIATION</text>
  <text x="1014" y="402" font-size="13.5" fill="#5b6b84" text-anchor="middle">outstanding-checks line and count</text>
  <text x="1014" y="424" font-size="13.5" fill="#5b6b84" text-anchor="middle">tie the re-derived set; six aging</text>
  <text x="1014" y="446" font-size="13.5" fill="#5b6b84" text-anchor="middle">bands tie the recomputed profile</text>

  <rect x="56" y="560" width="1088" height="58" rx="14" fill="#0f2a5c"/>
  <text x="82" y="596" font-size="18" font-weight="600" fill="#ffffff">20 controls</text>
  <text x="256" y="596" font-size="18" font-weight="600" fill="#9fc0ff">7 families</text>
  <text x="410" y="596" font-size="18" font-weight="600" fill="#ffffff">10,361 tests</text>
  <text x="592" y="596" font-size="18" font-weight="600" fill="#9fc0ff">read-only</text>
  <text x="1118" y="596" font-size="15" fill="#8fb2f2" text-anchor="end" letter-spacing="1.5">SFS-E44-OCA</text>
</svg>
