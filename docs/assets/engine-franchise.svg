<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" role="img" aria-label="Franchise Tax Combined Apportionment engine tile: the combined-group roster rebuilt from the prior year, consolidated revenue tied to the trial balance, and the margin apportioned by a single receipts factor and re-derived to the filed tax.">
  <defs>
    <pattern id="grid-txf" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#eef2f8" stroke-width="1"/></pattern>
    <marker id="arw-txf" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1200" height="675" fill="#f6f8fb"/><rect width="1200" height="675" fill="url(#grid-txf)"/>
  <rect x="16" y="16" width="1168" height="643" rx="18" fill="#ffffff" stroke="#e3e9f2" stroke-width="1.5"/>
  <text x="56" y="86" font-size="40" font-weight="700" fill="#0f2a5c">Franchise Tax Combined Apportionment</text>
  <text x="58" y="120" font-size="19" fill="#5b6b84" letter-spacing="0.5">SFS-E40-TXF &#183; is the tax on the combined return the tax the workpapers re-derive?</text>
  <rect x="1020" y="52" width="128" height="34" rx="17" fill="#eaf1ff" stroke="#c9dcff"/><text x="1084" y="75" font-size="15" font-weight="600" fill="#2563eb" text-anchor="middle">READ-ONLY</text>

  <!-- combined-group roster -->
  <rect x="56" y="222" width="222" height="178" rx="14" fill="#0f2a5c"/>
  <text x="167" y="256" font-size="15" fill="#9fc0ff" text-anchor="middle">COMBINED ROSTER</text>
  <text x="167" y="292" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">AFF-01 &#8230; AFF-05</text>
  <text x="167" y="322" font-size="13" fill="#8fb2f2" text-anchor="middle">prior year + additions</text>
  <text x="167" y="342" font-size="13" fill="#8fb2f2" text-anchor="middle">&#8722; removals, rebuilt</text>
  <text x="167" y="376" font-size="13" fill="#9fc0ff" text-anchor="middle">AFF-04 excluded, reason on file</text>

  <path d="M278 288H366" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-txf)"/>
  <text x="322" y="276" font-size="13" fill="#5b6b84" text-anchor="middle">members</text>

  <!-- trial balance and receipts factor -->
  <rect x="378" y="168" width="404" height="146" rx="14" fill="#ffffff" stroke="#c9dcff" stroke-width="1.5"/>
  <text x="398" y="200" font-size="16" font-weight="700" fill="#0f2a5c">Consolidated trial balance &#8594; group revenue</text>
  <g font-size="15" fill="#0f2a5c">
    <circle cx="410" cy="232" r="7" fill="#15803d"/><text x="428" y="237">Every line unique and attributed to a member</text>
    <circle cx="410" cy="264" r="7" fill="#15803d"/><text x="428" y="269">Revenue sums the lines &#8212; base ties the workpaper</text>
    <circle cx="410" cy="292" r="7" fill="#15803d"/><text x="428" y="297">Less elected deduction &#8594; taxable margin</text>
  </g>

  <rect x="378" y="332" width="404" height="140" rx="14" fill="#ffffff" stroke="#c9dcff" stroke-width="1.5"/>
  <text x="398" y="364" font-size="16" font-weight="700" fill="#0f2a5c">Single receipts factor &#183; in-state &#247; everywhere</text>
  <g font-size="15" fill="#0f2a5c">
    <circle cx="410" cy="396" r="7" fill="#15803d"/><text x="428" y="401">Totals sum the rows; in-state &#8804; everywhere</text>
    <circle cx="410" cy="428" r="7" fill="#15803d"/><text x="428" y="433">Floored to a basis point, bounded 0.00%&#8211;100.00%</text>
    <circle cx="410" cy="456" r="7" fill="#c0392b"/><text x="428" y="461" fill="#c0392b">Worksheet applied a factor the receipts do not support</text>
  </g>

  <path d="M782 241H870" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-txf)"/>
  <text x="826" y="229" font-size="13" fill="#5b6b84" text-anchor="middle">margin</text>
  <path d="M782 402H870V300" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-txf)"/>
  <text x="838" y="422" font-size="13" fill="#5b6b84" text-anchor="middle">factor</text>

  <!-- tax and rollup -->
  <rect x="874" y="200" width="270" height="120" rx="14" fill="#eaf1ff" stroke="#c9dcff" stroke-width="1.5"/>
  <text x="1009" y="234" font-size="14" fill="#2563eb" text-anchor="middle">MARGIN &#215; APPORTIONMENT &#215; RATE</text>
  <text x="1009" y="268" font-size="21" font-weight="700" fill="#0f2a5c" text-anchor="middle">franchise tax</text>
  <text x="1009" y="296" font-size="13" fill="#5b6b84" text-anchor="middle">truncating bps, compared with exact ==</text>

  <rect x="874" y="352" width="270" height="120" rx="14" fill="#fdf7ec" stroke="#eecfa3" stroke-width="1.5"/>
  <text x="1009" y="388" font-size="17" fill="#c8912f" text-anchor="middle">verdict: FAIL</text>
  <text x="1009" y="416" font-size="13" fill="#5b6b84" text-anchor="middle">summary recomputes from the workpapers,</text>
  <text x="1009" y="438" font-size="13" fill="#5b6b84" text-anchor="middle">return total ties the summary and roster &#8212;</text>
  <text x="1009" y="460" font-size="13" fill="#5b6b84" text-anchor="middle">one apportionment factor does not tie</text>

  <path d="M1009 320V346" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-txf)"/>

  <rect x="56" y="560" width="1088" height="58" rx="14" fill="#0f2a5c"/>
  <text x="82" y="596" font-size="18" font-weight="600" fill="#ffffff">21 controls</text>
  <text x="256" y="596" font-size="18" font-weight="600" fill="#9fc0ff">7 families</text>
  <text x="410" y="596" font-size="18" font-weight="600" fill="#ffffff">10,344 tests</text>
  <text x="596" y="596" font-size="18" font-weight="600" fill="#9fc0ff">read-only</text>
  <text x="1118" y="596" font-size="15" fill="#8fb2f2" text-anchor="end" letter-spacing="1.5">SFS-E40-TXF</text>
</svg>
