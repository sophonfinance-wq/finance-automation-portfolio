<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" role="img" aria-label="Gross-Receipts &amp; Excise Tax engine tile: each worksheet's tax re-derived from the GL revenue pull and the classification rate in force for the period, tied to the number filed, with the filing calendar proved complete, timely and approved.">
  <defs>
    <pattern id="grid-grt" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#eef2f8" stroke-width="1"/></pattern>
    <marker id="arw-grt" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1200" height="675" fill="#f6f8fb"/><rect width="1200" height="675" fill="url(#grid-grt)"/>
  <rect x="16" y="16" width="1168" height="643" rx="18" fill="#ffffff" stroke="#e3e9f2" stroke-width="1.5"/>
  <text x="56" y="86" font-size="40" font-weight="700" fill="#0f2a5c">Gross-Receipts &amp; Excise Tax</text>
  <text x="58" y="120" font-size="19" fill="#5b6b84" letter-spacing="0.5">SFS-E24-GRT &#183; is the tax the tax the receipts produce?</text>
  <rect x="1020" y="52" width="128" height="34" rx="17" fill="#eaf1ff" stroke="#c9dcff"/><text x="1084" y="75" font-size="15" font-weight="600" fill="#2563eb" text-anchor="middle">READ-ONLY</text>

  <!-- GL revenue pull -->
  <rect x="56" y="250" width="196" height="120" rx="14" fill="#0f2a5c"/>
  <text x="154" y="292" font-size="15" fill="#9fc0ff" text-anchor="middle">GL REVENUE PULL</text>
  <text x="154" y="326" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">$4,180,000</text>
  <text x="154" y="352" font-size="13" fill="#8fb2f2" text-anchor="middle">gross receipts, this period</text>

  <path d="M252 310H352" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-grt)"/>
  <text x="302" y="298" font-size="12.5" fill="#5b6b84" text-anchor="middle">re-derived on</text>

  <!-- rate table + re-derivation -->
  <rect x="358" y="196" width="480" height="248" rx="14" fill="#ffffff" stroke="#c9dcff" stroke-width="1.5"/>
  <text x="378" y="228" font-size="16" font-weight="700" fill="#0f2a5c">Rate table &amp; re-derivation</text>
  <g font-size="15.5" fill="#0f2a5c">
    <circle cx="390" cy="260" r="8" fill="#15803d"/><text x="410" y="265">Base = gross &#8722; back-out &#8722; standard deduction</text>
    <circle cx="390" cy="294" r="8" fill="#15803d"/><text x="410" y="299">Rate in force for the period (window, mid-year change)</text>
    <circle cx="390" cy="328" r="8" fill="#15803d"/><text x="410" y="333">Tax = base &#215; rate, net of threshold / SB credit</text>
    <circle cx="390" cy="362" r="8" fill="#15803d"/><text x="410" y="367">Tax due ties the number filed &#8212; exact to the cent</text>
    <circle cx="390" cy="396" r="8" fill="#c0392b"/><text x="410" y="401" fill="#c0392b">One worksheet applied last quarter's rate</text>
  </g>

  <!-- filing calendar -->
  <rect x="358" y="462" width="480" height="70" rx="12" fill="#fbfdff" stroke="#d9e6fb" stroke-width="1.5"/>
  <g font-size="14" fill="#5b6b84">
    <circle cx="390" cy="497" r="7" fill="#15803d"/><text x="406" y="502">filed, on time</text>
    <circle cx="612" cy="497" r="7" fill="#c8912f"/><text x="628" y="502" fill="#c8912f">unfiled, due soon</text>
  </g>
  <circle cx="390" cy="521" r="7" fill="#c0392b"/><text x="406" y="526" font-size="14" fill="#c0392b">filed before it was approved</text>

  <!-- verdict / rollup -->
  <rect x="862" y="250" width="282" height="120" rx="14" fill="#fdf7ec" stroke="#eecfa3" stroke-width="1.5"/>
  <text x="1003" y="292" font-size="17" fill="#c8912f" text-anchor="middle">verdict: FAIL</text>
  <text x="1003" y="322" font-size="14" fill="#5b6b84" text-anchor="middle">portfolio total recomputes from the</text>
  <text x="1003" y="344" font-size="14" fill="#5b6b84" text-anchor="middle">worksheets &#8212; a stale rate does not tie</text>

  <rect x="56" y="560" width="1088" height="58" rx="14" fill="#0f2a5c"/>
  <text x="82" y="596" font-size="18" font-weight="600" fill="#ffffff">27 controls</text>
  <text x="256" y="596" font-size="18" font-weight="600" fill="#9fc0ff">11 families</text>
  <text x="430" y="596" font-size="18" font-weight="600" fill="#ffffff">400 tests</text>
  <text x="576" y="596" font-size="18" font-weight="600" fill="#9fc0ff">tax to the cent</text>
  <text x="1118" y="596" font-size="15" fill="#8fb2f2" text-anchor="end" letter-spacing="1.5">SOPHON FINANCE SYSTEMS</text>
</svg>
