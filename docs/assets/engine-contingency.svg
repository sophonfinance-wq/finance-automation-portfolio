<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" role="img" aria-label="Contingency Rollforward and Adequacy engine tile: both contingency rollforwards recomputed from the period before them, the allocated total footed to the draw detail beneath it, every bucket reconciled to the budget line that funded it, and the word adequate rebuilt from the two amounts that define it.">
  <defs>
    <pattern id="grid-ctg" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#eef2f8" stroke-width="1"/></pattern>
    <marker id="arw-ctg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1200" height="675" fill="#f6f8fb"/><rect width="1200" height="675" fill="url(#grid-ctg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="18" fill="#ffffff" stroke="#e3e9f2" stroke-width="1.5"/>
  <text x="56" y="86" font-size="40" font-weight="700" fill="#0f2a5c">Contingency Rollforward &amp; Adequacy</text>
  <text x="58" y="120" font-size="19" fill="#5b6b84" letter-spacing="0.5">SFS-E46-CTG &#183; is the contingency still adequate, or does it just still say so?</text>
  <rect x="1020" y="52" width="128" height="34" rx="17" fill="#eaf1ff" stroke="#c9dcff"/><text x="1084" y="75" font-size="15" font-weight="600" fill="#2563eb" text-anchor="middle">READ-ONLY</text>

  <!-- the contingency block under test -->
  <rect x="56" y="180" width="214" height="140" rx="14" fill="#0f2a5c"/>
  <text x="163" y="214" font-size="15" fill="#9fc0ff" text-anchor="middle">CONTINGENCY BLOCK</text>
  <text x="163" y="248" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">PRJ-401</text>
  <text x="163" y="274" font-size="13" fill="#8fb2f2" text-anchor="middle">construction bucket &#183; 2031-Q3</text>
  <text x="163" y="298" font-size="13" fill="#8fb2f2" text-anchor="middle">six figures and one word</text>

  <rect x="56" y="342" width="214" height="118" rx="14" fill="#ffffff" stroke="#c9dcff" stroke-width="1.5"/>
  <text x="163" y="374" font-size="15" font-weight="700" fill="#0f2a5c" text-anchor="middle">ALLOCATION REGISTER</text>
  <text x="163" y="402" font-size="13.5" fill="#5b6b84" text-anchor="middle">every draw &#183; project &#183; bucket &#183; date</text>
  <text x="163" y="428" font-size="13.5" fill="#5b6b84" text-anchor="middle">the total is footed from these</text>
  <text x="163" y="450" font-size="12.5" fill="#8794aa" text-anchor="middle">never maintained beside them</text>

  <path d="M270 250H366" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-ctg)"/>
  <text x="318" y="238" font-size="13" fill="#5b6b84" text-anchor="middle">rolled forward</text>
  <path d="M270 400H340L340 300H366" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-ctg)"/>
  <text x="318" y="418" font-size="13" fill="#5b6b84" text-anchor="middle">foots the total</text>

  <!-- rollforward kernel -->
  <rect x="378" y="164" width="418" height="326" rx="14" fill="#ffffff" stroke="#c9dcff" stroke-width="1.5"/>
  <text x="398" y="196" font-size="16" font-weight="700" fill="#0f2a5c">Rollforward &#183; measured to the period in the file</text>
  <g font-size="15" fill="#0f2a5c">
    <circle cx="410" cy="228" r="8" fill="#15803d"/><text x="430" y="233">Remaining = prior balance less allocated this period</text>
    <circle cx="410" cy="262" r="8" fill="#15803d"/><text x="430" y="267">To date = prior to-date plus this period's releases</text>
    <circle cx="410" cy="296" r="8" fill="#15803d"/><text x="430" y="301">Remaining plus to-date reconciles to the budget line</text>
    <circle cx="410" cy="330" r="8" fill="#15803d"/><text x="430" y="335">Each draw walked against what earlier draws left</text>
    <circle cx="410" cy="364" r="8" fill="#c8912f"/><text x="430" y="369" fill="#c8912f">Covered, but thinned into the file's own watch band</text>
    <circle cx="410" cy="398" r="8" fill="#c0392b"/><text x="430" y="403" fill="#c0392b">Still reads adequate; the projection now exceeds it</text>
    <circle cx="410" cy="432" r="8" fill="#c0392b"/><text x="430" y="437" fill="#c0392b">One draw a cent past the balance in front of it</text>
  </g>
  <text x="398" y="470" font-size="12.5" fill="#8794aa">a draw to exactly zero is allowed &#183; integer cents, exact ==</text>

  <path d="M796 250H872" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-ctg)"/>
  <path d="M796 400H872" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-ctg)"/>

  <!-- adequacy + rollup -->
  <rect x="884" y="188" width="260" height="124" rx="14" fill="#fdf7ec" stroke="#eecfa3" stroke-width="1.5"/>
  <text x="1014" y="222" font-size="15" font-weight="700" fill="#c8912f" text-anchor="middle">ADEQUACY, RECOMPUTED</text>
  <text x="1014" y="252" font-size="13.5" fill="#5b6b84" text-anchor="middle">adequate means the balance</text>
  <text x="1014" y="274" font-size="13.5" fill="#5b6b84" text-anchor="middle">covers the projection &#8212; struck</text>
  <text x="1014" y="296" font-size="13.5" fill="#5b6b84" text-anchor="middle">here, never read as a label</text>

  <rect x="884" y="338" width="260" height="124" rx="14" fill="#eaf1ff" stroke="#c9dcff" stroke-width="1.5"/>
  <text x="1014" y="372" font-size="15" font-weight="700" fill="#2563eb" text-anchor="middle">PORTFOLIO ROLLUP</text>
  <text x="1014" y="402" font-size="13.5" fill="#5b6b84" text-anchor="middle">three totals re-summed from the</text>
  <text x="1014" y="424" font-size="13.5" fill="#5b6b84" text-anchor="middle">blocks; the inadequate count</text>
  <text x="1014" y="446" font-size="13.5" fill="#5b6b84" text-anchor="middle">recounted, not read off them</text>

  <rect x="56" y="560" width="1088" height="58" rx="14" fill="#0f2a5c"/>
  <text x="82" y="596" font-size="18" font-weight="600" fill="#ffffff">22 controls</text>
  <text x="256" y="596" font-size="18" font-weight="600" fill="#9fc0ff">6 families</text>
  <text x="410" y="596" font-size="18" font-weight="600" fill="#ffffff">10,368 tests</text>
  <text x="592" y="596" font-size="18" font-weight="600" fill="#9fc0ff">read-only</text>
  <text x="1118" y="596" font-size="15" fill="#8fb2f2" text-anchor="end" letter-spacing="1.5">SFS-E46-CTG</text>
</svg>
