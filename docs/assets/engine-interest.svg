<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" role="img" aria-label="Interest Accrual &amp; Loan Amortization engine tile: every note's accrued interest re-derived from beginning balance times rate times days, the balance rolled forward begin to end, and the reciprocal receivable, payable and interest journal tied out to the schedule.">
  <defs>
    <pattern id="grid-int" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#eef2f8" stroke-width="1"/></pattern>
    <marker id="arw-int" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1200" height="675" fill="#f6f8fb"/><rect width="1200" height="675" fill="url(#grid-int)"/>
  <rect x="16" y="16" width="1168" height="643" rx="18" fill="#ffffff" stroke="#e3e9f2" stroke-width="1.5"/>
  <text x="56" y="86" font-size="40" font-weight="700" fill="#0f2a5c">Interest Accrual &amp; Loan Amortization</text>
  <text x="58" y="120" font-size="19" fill="#5b6b84" letter-spacing="0.5">SFS-E27-INT &#183; does the interest a note reports equal the interest its own terms produce?</text>
  <rect x="1020" y="52" width="128" height="34" rx="17" fill="#eaf1ff" stroke="#c9dcff"/><text x="1084" y="75" font-size="15" font-weight="600" fill="#2563eb" text-anchor="middle">READ-ONLY</text>

  <!-- promissory note -->
  <rect x="56" y="246" width="204" height="130" rx="14" fill="#0f2a5c"/>
  <text x="158" y="286" font-size="16" fill="#9fc0ff" text-anchor="middle">PROMISSORY NOTE</text>
  <text x="158" y="320" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle">NR-1401</text>
  <text x="158" y="346" font-size="13" fill="#8fb2f2" text-anchor="middle">700 bps &#183; actual/365</text>
  <text x="158" y="365" font-size="13" fill="#8fb2f2" text-anchor="middle">matures 2031-06-30</text>

  <path d="M260 311H360" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-int)"/>
  <text x="310" y="299" font-size="13" fill="#5b6b84" text-anchor="middle">rolls</text>
  <text x="310" y="333" font-size="13" fill="#5b6b84" text-anchor="middle">forward</text>

  <!-- roll-forward panel -->
  <rect x="372" y="196" width="470" height="252" rx="14" fill="#ffffff" stroke="#c9dcff" stroke-width="1.5"/>
  <text x="392" y="228" font-size="16" font-weight="700" fill="#0f2a5c">Roll-forward &#183; begin + advance + accrued &#8722; pay</text>
  <g font-size="15.5" fill="#0f2a5c">
    <circle cx="404" cy="260" r="8" fill="#15803d"/><text x="424" y="265">Accrued = begin &#215; rate &#215; days &#247; year</text>
    <circle cx="404" cy="294" r="8" fill="#15803d"/><text x="424" y="299">Ending is the next period's beginning</text>
    <circle cx="404" cy="328" r="8" fill="#15803d"/><text x="424" y="333">Accrual stops on the maturity date</text>
    <circle cx="404" cy="362" r="8" fill="#15803d"/><text x="424" y="367">Default rate steps on the event date</text>
    <circle cx="404" cy="396" r="8" fill="#c0392b"/><text x="424" y="401" fill="#c0392b">One accrual off by a cent &#8212; does not re-derive</text>
    <circle cx="404" cy="430" r="8" fill="#c8912f"/><text x="424" y="435" fill="#c8912f">One note maturing inside the lead-time window</text>
  </g>

  <!-- reciprocal tie-out -->
  <rect x="866" y="196" width="278" height="252" rx="14" fill="#f7faff" stroke="#c9dcff" stroke-width="1.5"/>
  <text x="1005" y="228" font-size="15" font-weight="700" fill="#0f2a5c" text-anchor="middle">Reciprocal tie-out</text>
  <g font-size="13.5" fill="#5b6b84">
    <text x="886" y="262">Receivable = Payable = schedule</text>
    <text x="886" y="292">Income = Expense = accrual</text>
    <text x="886" y="322">Journal proves to zero</text>
    <text x="886" y="352">Journal ties the accrued total</text>
  </g>
  <rect x="886" y="372" width="238" height="56" rx="10" fill="#fdf7ec" stroke="#eecfa3"/>
  <text x="1005" y="396" font-size="15" fill="#c8912f" text-anchor="middle">verdict: REVIEW</text>
  <text x="1005" y="416" font-size="12.5" fill="#5b6b84" text-anchor="middle">schedule ties &#8212; a note comes due soon</text>

  <rect x="56" y="560" width="1088" height="58" rx="14" fill="#0f2a5c"/>
  <text x="82" y="596" font-size="18" font-weight="600" fill="#ffffff">28 controls</text>
  <text x="256" y="596" font-size="18" font-weight="600" fill="#9fc0ff">9 families</text>
  <text x="410" y="596" font-size="18" font-weight="600" fill="#ffffff">402 tests</text>
  <text x="556" y="596" font-size="18" font-weight="600" fill="#9fc0ff">read-only</text>
  <text x="1118" y="596" font-size="15" fill="#8fb2f2" text-anchor="end" letter-spacing="1.5">SFS-E27-INT</text>
</svg>
