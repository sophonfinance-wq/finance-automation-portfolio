<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" role="img" aria-label="Filing Obligation Calendar engine tile: each entity's return and payment obligation re-derived from the statutory due-dates table, proved filed or validly extended before its deadline, fixed-amount vouchers cut to the statutory constant, and the status register tied to filed evidence.">
  <defs>
    <pattern id="grid-due" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#eef2f8" stroke-width="1"/></pattern>
    <marker id="arw-due" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1200" height="675" fill="#f6f8fb"/><rect width="1200" height="675" fill="url(#grid-due)"/>
  <rect x="16" y="16" width="1168" height="643" rx="18" fill="#ffffff" stroke="#e3e9f2" stroke-width="1.5"/>
  <text x="56" y="86" font-size="40" font-weight="700" fill="#0f2a5c">Filing Obligation Calendar</text>
  <text x="58" y="120" font-size="19" fill="#5b6b84" letter-spacing="0.5">SFS-E25-DUE &#183; was every deadline met or validly deferred?</text>
  <rect x="1020" y="52" width="128" height="34" rx="17" fill="#eaf1ff" stroke="#c9dcff"/><text x="1084" y="75" font-size="15" font-weight="600" fill="#2563eb" text-anchor="middle">READ-ONLY</text>

  <!-- entity + obligations -->
  <rect x="56" y="250" width="204" height="120" rx="14" fill="#0f2a5c"/>
  <text x="158" y="296" font-size="17" fill="#9fc0ff" text-anchor="middle">ROSTERED ENTITY</text>
  <text x="158" y="330" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">ENT-101</text>
  <text x="158" y="356" font-size="13" fill="#8fb2f2" text-anchor="middle">three filing obligations</text>

  <path d="M260 310H360" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-due)"/>
  <text x="310" y="298" font-size="13" fill="#5b6b84" text-anchor="middle">re-derived from</text>
  <text x="310" y="332" font-size="13" fill="#5b6b84" text-anchor="middle">the statutory table</text>

  <!-- due-date checks -->
  <rect x="372" y="200" width="470" height="240" rx="14" fill="#ffffff" stroke="#c9dcff" stroke-width="1.5"/>
  <text x="392" y="232" font-size="16" font-weight="700" fill="#0f2a5c">Statutory due-dates table</text>
  <g font-size="15.5" fill="#0f2a5c">
    <circle cx="404" cy="264" r="8" fill="#15803d"/><text x="424" y="269">FED-1065 original re-derives &#183; ext +6 months</text>
    <circle cx="404" cy="298" r="8" fill="#15803d"/><text x="424" y="303">Extension filed &#8594; acceptance on file</text>
    <circle cx="404" cy="332" r="8" fill="#15803d"/><text x="424" y="337">MAR-3522 voucher = $800 statutory constant</text>
    <circle cx="404" cy="366" r="8" fill="#c0392b"/><text x="424" y="371" fill="#c0392b">State return OVERDUE &#8212; unfiled past deadline</text>
    <circle cx="404" cy="400" r="8" fill="#c8912f"/><text x="424" y="405" fill="#c8912f">Federal due in 12 days &#8212; on the watchlist</text>
  </g>

  <!-- verdict -->
  <rect x="866" y="250" width="278" height="120" rx="14" fill="#fdf7ec" stroke="#eecfa3" stroke-width="1.5"/>
  <text x="1005" y="292" font-size="17" fill="#c8912f" text-anchor="middle">verdict: FAIL</text>
  <text x="1005" y="322" font-size="14" fill="#5b6b84" text-anchor="middle">dates re-derive, evidence ties &#8212;</text>
  <text x="1005" y="344" font-size="14" fill="#5b6b84" text-anchor="middle">one deadline slid past unfiled</text>

  <!-- status roll-up strip -->
  <rect x="372" y="456" width="772" height="72" rx="12" fill="#f2f6fc" stroke="#d7e2f2" stroke-width="1.3"/>
  <text x="392" y="484" font-size="14.5" font-weight="700" fill="#0f2a5c">Status summary recomputes from the register</text>
  <text x="392" y="510" font-size="13.5" fill="#5b6b84">overdue &amp; filed counts tie &#183; every status rebuilt from its own dates &#183; watchlist tied</text>

  <rect x="56" y="560" width="1088" height="58" rx="14" fill="#0f2a5c"/>
  <text x="82" y="596" font-size="18" font-weight="600" fill="#ffffff">22 controls</text>
  <text x="256" y="596" font-size="18" font-weight="600" fill="#9fc0ff">9 families</text>
  <text x="410" y="596" font-size="18" font-weight="600" fill="#ffffff">10,369 tests</text>
  <text x="556" y="596" font-size="18" font-weight="600" fill="#9fc0ff">met at the date</text>
  <text x="1118" y="596" font-size="15" fill="#8fb2f2" text-anchor="end" letter-spacing="1.5">SOPHON FINANCE SYSTEMS</text>
</svg>
