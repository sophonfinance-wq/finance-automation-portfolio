<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" role="img" aria-label="Equity-Method Pickup &amp; Eliminations engine tile: each equity pickup re-derived as ownership times sub net income, and every Investment account extinguished against the sub's Equity-Parent account for exactly the carrying value the roll-forward ends at.">
  <defs>
    <pattern id="grid-epu" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#eef2f8" stroke-width="1"/></pattern>
    <marker id="arw-epu" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1200" height="675" fill="#f6f8fb"/><rect width="1200" height="675" fill="url(#grid-epu)"/>
  <rect x="16" y="16" width="1168" height="643" rx="18" fill="#ffffff" stroke="#e3e9f2" stroke-width="1.5"/>
  <text x="56" y="86" font-size="38" font-weight="700" fill="#0f2a5c">Equity-Method Pickup &amp; Eliminations</text>
  <text x="58" y="120" font-size="18" fill="#5b6b84" letter-spacing="0.4">SFS-E35-EPU &#183; does the pickup re-derive from ownership, and does the elimination extinguish the carrying value?</text>
  <rect x="1020" y="52" width="128" height="34" rx="17" fill="#eaf1ff" stroke="#c9dcff"/><text x="1084" y="75" font-size="15" font-weight="600" fill="#2563eb" text-anchor="middle">READ-ONLY</text>

  <!-- sub result -->
  <rect x="56" y="250" width="210" height="140" rx="14" fill="#0f2a5c"/>
  <text x="161" y="290" font-size="15" fill="#9fc0ff" text-anchor="middle">SUBSIDIARY RESULT</text>
  <text x="161" y="322" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">SUB-285</text>
  <text x="161" y="348" font-size="13" fill="#8fb2f2" text-anchor="middle">net income &#183; distributions</text>
  <text x="161" y="372" font-size="13" fill="#8fb2f2" text-anchor="middle">ownership 50.00% + 50.00%</text>

  <path d="M266 320H360" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-epu)"/>
  <text x="313" y="308" font-size="13" fill="#5b6b84" text-anchor="middle">ownership</text>
  <text x="313" y="342" font-size="13" fill="#5b6b84" text-anchor="middle">&#215; income</text>

  <!-- re-derivations -->
  <rect x="372" y="182" width="474" height="286" rx="14" fill="#ffffff" stroke="#c9dcff" stroke-width="1.5"/>
  <text x="392" y="214" font-size="16" font-weight="700" fill="#0f2a5c">Re-derived to the cent, compared with ==</text>
  <g font-size="15" fill="#0f2a5c">
    <circle cx="404" cy="246" r="8" fill="#15803d"/><text x="424" y="251">Pickup = ownership &#215; sub net income</text>
    <circle cx="404" cy="280" r="8" fill="#15803d"/><text x="424" y="285">Roll-fwd: begin + contrib + pickup &#8722; dist = end</text>
    <circle cx="404" cy="314" r="8" fill="#15803d"/><text x="424" y="319">Elimination pairs Investment &#8596; Equity-Parent</text>
    <circle cx="404" cy="348" r="8" fill="#15803d"/><text x="424" y="353">Credit to Investment = carrying value at end</text>
    <circle cx="404" cy="382" r="8" fill="#15803d"/><text x="424" y="387">Accrual = capital &#215; rate &#215; days / basis</text>
    <circle cx="404" cy="416" r="8" fill="#c0392b"/><text x="424" y="421" fill="#c0392b">One block balances but leaves a stale residual</text>
    <circle cx="404" cy="450" r="8" fill="#c8912f"/><text x="424" y="455" fill="#c8912f">One adjustment is derived but never posted</text>
  </g>

  <!-- consolidation -->
  <rect x="872" y="250" width="272" height="140" rx="14" fill="#fdf7ec" stroke="#eecfa3" stroke-width="1.5"/>
  <text x="1008" y="290" font-size="17" fill="#c8912f" text-anchor="middle">verdict: REVIEW</text>
  <text x="1008" y="320" font-size="13.5" fill="#5b6b84" text-anchor="middle">pickup re-derives, eliminations</text>
  <text x="1008" y="340" font-size="13.5" fill="#5b6b84" text-anchor="middle">extinguish, blocks net to zero &#8212;</text>
  <text x="1008" y="360" font-size="13.5" fill="#5b6b84" text-anchor="middle">an adjustment awaits a human's entry</text>

  <rect x="56" y="560" width="1088" height="58" rx="14" fill="#0f2a5c"/>
  <text x="82" y="596" font-size="18" font-weight="600" fill="#ffffff">25 controls</text>
  <text x="256" y="596" font-size="18" font-weight="600" fill="#9fc0ff">6 families</text>
  <text x="404" y="596" font-size="18" font-weight="600" fill="#ffffff">10,423 tests</text>
  <text x="556" y="596" font-size="18" font-weight="600" fill="#9fc0ff">read-only</text>
  <text x="1118" y="596" font-size="15" fill="#8fb2f2" text-anchor="end" letter-spacing="1.5">SFS-E35-EPU</text>
</svg>
