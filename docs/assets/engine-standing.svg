<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" role="img" aria-label="Entity Good-Standing engine tile: each entity proved state by state to have filed on time, paid the flat franchise tax, read ACTIVE at the Secretary of State and held its contracted agent, with the standing rollup recomputed from the state records.">
  <defs>
    <pattern id="grid-gds" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#eef2f8" stroke-width="1"/></pattern>
    <marker id="arw-gds" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1200" height="675" fill="#f6f8fb"/><rect width="1200" height="675" fill="url(#grid-gds)"/>
  <rect x="16" y="16" width="1168" height="643" rx="18" fill="#ffffff" stroke="#e3e9f2" stroke-width="1.5"/>
  <text x="56" y="86" font-size="40" font-weight="700" fill="#0f2a5c">Entity Good-Standing</text>
  <text x="58" y="120" font-size="19" fill="#5b6b84" letter-spacing="0.5">SFS-E33-GDS &#183; is each entity in good standing in every state, and does that recompute?</text>
  <rect x="1020" y="52" width="128" height="34" rx="17" fill="#eaf1ff" stroke="#c9dcff"/><text x="1084" y="75" font-size="15" font-weight="600" fill="#2563eb" text-anchor="middle">READ-ONLY</text>

  <!-- entity register -->
  <rect x="56" y="238" width="210" height="150" rx="14" fill="#0f2a5c"/>
  <text x="161" y="278" font-size="16" fill="#9fc0ff" text-anchor="middle">ENTITY REGISTER</text>
  <text x="161" y="308" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">ENT-101 Northmoor</text>
  <text x="161" y="332" font-size="14" fill="#8fb2f2" text-anchor="middle">Marran &#183; Kelder &#183; active</text>
  <text x="161" y="360" font-size="13.5" fill="#8fb2f2" text-anchor="middle">Halbrook &#183; Stonecrest &#183; Ardenne</text>

  <path d="M266 313H360" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-gds)"/>
  <text x="313" y="301" font-size="13" fill="#5b6b84" text-anchor="middle">gated,</text>
  <text x="313" y="335" font-size="13" fill="#5b6b84" text-anchor="middle">state by state</text>

  <!-- good-standing gates -->
  <rect x="372" y="182" width="470" height="286" rx="14" fill="#ffffff" stroke="#c9dcff" stroke-width="1.5"/>
  <text x="392" y="214" font-size="16" font-weight="700" fill="#0f2a5c">Per-(entity, state) gates</text>
  <g font-size="15" fill="#0f2a5c">
    <circle cx="404" cy="244" r="8" fill="#15803d"/><text x="424" y="249">Report filed on-or-before re-derived due date</text>
    <circle cx="404" cy="278" r="8" fill="#15803d"/><text x="424" y="283">Flat franchise tax met (&#8805;) and paid on time</text>
    <circle cx="404" cy="312" r="8" fill="#15803d"/><text x="424" y="317">Registered agent of record = contracted agent</text>
    <circle cx="404" cy="346" r="8" fill="#15803d"/><text x="424" y="351">Business licence current past the review date</text>
    <circle cx="404" cy="380" r="8" fill="#c0392b"/><text x="424" y="385" fill="#c0392b">One record reads SUSPENDED &#8212; standing is gone</text>
    <circle cx="404" cy="414" r="8" fill="#c0392b"/><text x="424" y="419" fill="#c0392b">One report filed PAST DUE &#8212; drifting to suspension</text>
    <circle cx="404" cy="448" r="8" fill="#c8912f"/><text x="424" y="453" fill="#c8912f">One next filing inside the renewal window &#8212; flag</text>
  </g>

  <!-- dissolution completeness -->
  <rect x="866" y="182" width="278" height="96" rx="14" fill="#f4f7fc" stroke="#c9dcff" stroke-width="1.5"/>
  <text x="1005" y="214" font-size="15" font-weight="700" fill="#0f2a5c" text-anchor="middle">Dissolved: Ardenne</text>
  <text x="1005" y="240" font-size="13.5" fill="#5b6b84" text-anchor="middle">certificate of cancellation filed</text>
  <text x="1005" y="260" font-size="13.5" fill="#5b6b84" text-anchor="middle">in every state it belonged to</text>

  <!-- rollup recompute -->
  <rect x="866" y="300" width="278" height="150" rx="14" fill="#fdf7ec" stroke="#eecfa3" stroke-width="1.5"/>
  <text x="1005" y="332" font-size="17" fill="#c8912f" text-anchor="middle">verdict: REVIEW</text>
  <text x="1005" y="360" font-size="13.5" fill="#5b6b84" text-anchor="middle">standing summary and family counts</text>
  <text x="1005" y="380" font-size="13.5" fill="#5b6b84" text-anchor="middle">recompute from the state records &#8212;</text>
  <text x="1005" y="404" font-size="13.5" fill="#5b6b84" text-anchor="middle">a filing is due inside the renewal</text>
  <text x="1005" y="424" font-size="13.5" fill="#5b6b84" text-anchor="middle">window and needs to be made</text>

  <path d="M842 325H860" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-gds)"/>
  <path d="M842 375H860" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-gds)"/>

  <rect x="56" y="560" width="1088" height="58" rx="14" fill="#0f2a5c"/>
  <text x="82" y="596" font-size="18" font-weight="600" fill="#ffffff">26 controls</text>
  <text x="256" y="596" font-size="18" font-weight="600" fill="#9fc0ff">11 families</text>
  <text x="420" y="596" font-size="18" font-weight="600" fill="#ffffff">385 tests</text>
  <text x="566" y="596" font-size="18" font-weight="600" fill="#9fc0ff">read-only</text>
  <text x="1118" y="596" font-size="15" fill="#8fb2f2" text-anchor="end" letter-spacing="1.5">SFS-E33-GDS</text>
</svg>
