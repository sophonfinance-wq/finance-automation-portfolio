<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" role="img" aria-label="Equity Waterfall and JV Promote engine tile: a real-estate joint venture's distribution waterfall re-derived tier by tier from the executed agreement's mechanics and the contribution history.">
  <defs>
    <pattern id="grid-wfl" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#eef2f8" stroke-width="1"/></pattern>
    <marker id="arw-wfl" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1200" height="675" fill="#f6f8fb"/><rect width="1200" height="675" fill="url(#grid-wfl)"/>
  <rect x="16" y="16" width="1168" height="643" rx="18" fill="#ffffff" stroke="#e3e9f2" stroke-width="1.5"/>
  <text x="56" y="86" font-size="40" font-weight="700" fill="#0f2a5c">Equity Waterfall &amp; JV Promote</text>
  <text x="58" y="120" font-size="19" fill="#5b6b84" letter-spacing="0.5">SFS-E22-WFL &#183; does the schedule pay what the agreement promises?</text>
  <rect x="1020" y="52" width="128" height="34" rx="17" fill="#eaf1ff" stroke="#c9dcff"/><text x="1084" y="75" font-size="15" font-weight="600" fill="#2563eb" text-anchor="middle">READ-ONLY</text>

  <!-- capital in -->
  <rect x="56" y="214" width="204" height="88" rx="14" fill="#0f2a5c"/>
  <text x="158" y="250" font-size="16" fill="#9fc0ff" text-anchor="middle">INVESTOR</text>
  <text x="158" y="282" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">Contribution</text>
  <rect x="56" y="318" width="204" height="88" rx="14" fill="#123a70"/>
  <text x="158" y="354" font-size="16" fill="#9fc0ff" text-anchor="middle">DEVELOPER</text>
  <text x="158" y="386" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">Contribution</text>

  <path d="M260 310H360" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-wfl)"/>
  <text x="310" y="290" font-size="13" fill="#5b6b84" text-anchor="middle">pref accrues</text>
  <text x="310" y="326" font-size="13" fill="#5b6b84" text-anchor="middle">monthly</text>

  <!-- waterfall tiers -->
  <rect x="372" y="176" width="470" height="322" rx="14" fill="#ffffff" stroke="#c9dcff" stroke-width="1.5"/>
  <text x="392" y="208" font-size="16" font-weight="700" fill="#0f2a5c">Section 3.3 waterfall &#8212; re-derived tier by tier</text>
  <g font-size="15.5" fill="#0f2a5c">
    <circle cx="404" cy="240" r="8" fill="#15803d"/><text x="424" y="245">A &#183; Preferred return &#8594; $0, pari passu</text>
    <circle cx="404" cy="278" r="8" fill="#15803d"/><text x="424" y="283">B &#183; Return of capital &#8594; $0, pari passu</text>
    <circle cx="404" cy="316" r="8" fill="#c0392b"/><text x="424" y="321" fill="#c0392b">C &#183; Hurdle split 70/30 to 16% IRR &#8212; a cent short</text>
    <circle cx="404" cy="354" r="8" fill="#c0392b"/><text x="424" y="359" fill="#c0392b">D &#183; Promote 50/50 &#8212; entered out of order</text>
  </g>
  <line x1="392" y1="384" x2="822" y2="384" stroke="#e3e9f2" stroke-width="1.4"/>
  <g font-size="14" fill="#5b6b84">
    <text x="392" y="414">Every accrual, tier and promote dollar rebuilt from the</text>
    <text x="392" y="436">contribution history through one shared kernel &#8212; compared</text>
    <text x="392" y="458">at exact integer cents, no tolerance band.</text>
  </g>
  <text x="392" y="486" font-size="13.5" fill="#8a97ad">30 controls &#183; 13 families &#183; 7 artifacts</text>

  <path d="M842 337H932" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-wfl)"/>

  <!-- verdict -->
  <rect x="944" y="252" width="200" height="170" rx="14" fill="#fdeceb" stroke="#eab3ad" stroke-width="1.5"/>
  <text x="1044" y="292" font-size="17" fill="#c0392b" text-anchor="middle">verdict: FAIL</text>
  <text x="1044" y="322" font-size="13.5" fill="#5b6b84" text-anchor="middle">the promote is larger</text>
  <text x="1044" y="342" font-size="13.5" fill="#5b6b84" text-anchor="middle">than the contract earns</text>
  <text x="1044" y="376" font-size="13" fill="#8a97ad" text-anchor="middle">multiple &#183; pref &#183; split</text>
  <text x="1044" y="396" font-size="13" fill="#8a97ad" text-anchor="middle">recompute, not asserted</text>

  <rect x="56" y="560" width="1088" height="58" rx="14" fill="#0f2a5c"/>
  <text x="82" y="596" font-size="18" font-weight="600" fill="#ffffff">30 controls</text>
  <text x="256" y="596" font-size="18" font-weight="600" fill="#9fc0ff">13 families</text>
  <text x="430" y="596" font-size="18" font-weight="600" fill="#ffffff">10,449 tests</text>
  <text x="576" y="596" font-size="18" font-weight="600" fill="#9fc0ff">cents, no tolerance</text>
  <text x="1118" y="596" font-size="15" fill="#8fb2f2" text-anchor="end" letter-spacing="1.5">SOPHON FINANCE SYSTEMS</text>
</svg>
