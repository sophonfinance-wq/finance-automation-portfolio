<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" role="img" aria-label="Section 263A Interest Capitalization engine tile: each quarter's capitalized interest re-derived as the period rate applied to the accumulated production expenditures, the split closing exactly to the interest incurred, and every annual, comparison and rollup figure recomputed from the quarters beneath it.">
  <defs>
    <pattern id="grid-cap" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#eef2f8" stroke-width="1"/></pattern>
    <marker id="arw-cap" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1200" height="675" fill="#f6f8fb"/><rect width="1200" height="675" fill="url(#grid-cap)"/>
  <rect x="16" y="16" width="1168" height="643" rx="18" fill="#ffffff" stroke="#e3e9f2" stroke-width="1.5"/>
  <text x="56" y="86" font-size="38" font-weight="700" fill="#0f2a5c">Section 263A Interest Capitalization</text>
  <text x="58" y="120" font-size="18" fill="#5b6b84" letter-spacing="0.4">SFS-E39-CAP &#183; does the interest each project capitalized re-derive from the expenditures and the rate?</text>
  <rect x="1020" y="52" width="128" height="34" rx="17" fill="#eaf1ff" stroke="#c9dcff"/><text x="1084" y="75" font-size="15" font-weight="600" fill="#2563eb" text-anchor="middle">READ-ONLY</text>

  <!-- trial balance -> roster -->
  <rect x="56" y="196" width="212" height="104" rx="14" fill="#0f2a5c"/>
  <text x="162" y="230" font-size="14" fill="#9fc0ff" text-anchor="middle">TRIAL BALANCE</text>
  <text x="162" y="260" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">5 projects</text>
  <text x="162" y="284" font-size="12.5" fill="#8fb2f2" text-anchor="middle">the authoritative population</text>
  <rect x="56" y="330" width="212" height="118" rx="14" fill="#ffffff" stroke="#c9dcff" stroke-width="1.5"/>
  <text x="162" y="360" font-size="14" fill="#5b6b84" text-anchor="middle">PROJECT ROSTER</text>
  <text x="162" y="388" font-size="16" font-weight="600" fill="#0f2a5c" text-anchor="middle">100/J-4101 &#8226; 100/J-4102</text>
  <text x="162" y="410" font-size="16" font-weight="600" fill="#0f2a5c" text-anchor="middle">200/J-4201 &#8226; 200/J-4202</text>
  <text x="162" y="434" font-size="12.5" fill="#c0392b" text-anchor="middle">300/J-9001 never reached it</text>
  <path d="M162 300V326" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-cap)"/>
  <path d="M268 389H354" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-cap)"/>
  <text x="311" y="378" font-size="12.5" fill="#5b6b84" text-anchor="middle">rolled by</text>
  <text x="311" y="410" font-size="12.5" fill="#5b6b84" text-anchor="middle">quarter</text>

  <!-- the quarter grid and the split -->
  <rect x="366" y="176" width="450" height="300" rx="14" fill="#ffffff" stroke="#c9dcff" stroke-width="1.5"/>
  <text x="388" y="208" font-size="15.5" font-weight="700" fill="#0f2a5c">FY2029 quarter grid &#183; expenditures &#215; 1.50% period rate</text>
  <g font-size="14.5" fill="#0f2a5c">
    <text x="388" y="242" font-family="'Segoe UI',monospace" fill="#5b6b84">Q          expenditures     capitalized</text>
    <text x="388" y="270" font-family="'Segoe UI',monospace">03-31      40,000,000        600,000</text>
    <text x="388" y="296" font-family="'Segoe UI',monospace">06-30      55,000,000        825,000</text>
    <text x="388" y="322" font-family="'Segoe UI',monospace">09-30      68,000,000      1,020,000</text>
    <text x="388" y="348" font-family="'Segoe UI',monospace">12-31      80,000,000      1,200,000</text>
  </g>
  <path d="M388 364H796" fill="none" stroke="#e3e9f2" stroke-width="1.5"/>
  <g font-size="14.5">
    <circle cx="398" cy="388" r="7" fill="#15803d"/><text x="416" y="393" fill="#0f2a5c">annual capitalized 3,645,000 foots the quarters</text>
    <circle cx="398" cy="418" r="7" fill="#15803d"/><text x="416" y="423" fill="#0f2a5c">interest = capitalized + deducted, exact, no leak</text>
    <circle cx="398" cy="448" r="7" fill="#c8912f"/><text x="416" y="453" fill="#c8912f">placed in service, still capitalizing &#8212; review</text>
  </g>

  <!-- comparison and rollup -->
  <path d="M816 326H892" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-cap)"/>
  <text x="854" y="315" font-size="12.5" fill="#5b6b84" text-anchor="middle">ties</text>
  <rect x="904" y="196" width="240" height="128" rx="14" fill="#ffffff" stroke="#c9dcff" stroke-width="1.5"/>
  <text x="1024" y="226" font-size="14" fill="#5b6b84" text-anchor="middle">COMPARISON</text>
  <text x="1024" y="254" font-size="14.5" fill="#0f2a5c" text-anchor="middle">prior 2,500,000</text>
  <text x="1024" y="278" font-size="14.5" fill="#0f2a5c" text-anchor="middle">+ current 3,645,000</text>
  <text x="1024" y="304" font-size="15.5" font-weight="700" fill="#0f2a5c" text-anchor="middle">= ending 6,145,000</text>
  <rect x="904" y="344" width="240" height="132" rx="14" fill="#fdf7ec" stroke="#eecfa3" stroke-width="1.5"/>
  <text x="1024" y="374" font-size="14" fill="#c8912f" text-anchor="middle">verdict: FAIL</text>
  <text x="1024" y="402" font-size="13" fill="#5b6b84" text-anchor="middle">total capitalized re-sums,</text>
  <text x="1024" y="424" font-size="13" fill="#5b6b84" text-anchor="middle">project count ties the roster &#8212;</text>
  <text x="1024" y="446" font-size="13" fill="#5b6b84" text-anchor="middle">a trial-balance project is</text>
  <text x="1024" y="466" font-size="13" fill="#5b6b84" text-anchor="middle">absent from the schedule</text>

  <rect x="56" y="560" width="1088" height="58" rx="14" fill="#0f2a5c"/>
  <text x="82" y="596" font-size="18" font-weight="600" fill="#ffffff">19 controls</text>
  <text x="256" y="596" font-size="18" font-weight="600" fill="#9fc0ff">6 families</text>
  <text x="412" y="596" font-size="18" font-weight="600" fill="#ffffff">10,323 tests</text>
  <text x="596" y="596" font-size="18" font-weight="600" fill="#9fc0ff">read-only</text>
  <text x="1118" y="596" font-size="15" fill="#8fb2f2" text-anchor="end" letter-spacing="1.5">SFS-E39-CAP</text>
</svg>
