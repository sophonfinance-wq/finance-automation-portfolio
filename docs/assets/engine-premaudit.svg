<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Premium Audit Response engine tile">
  <defs>
    <style>
      .ln { fill: none; stroke: #1a232e; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: #1a232e; stroke-width: 2; }
      .cb { fill: none; stroke: #2953ff; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .cbthin { fill: none; stroke: #2953ff; stroke-width: 2.5; }
      .lab { font: 600 26px 'Segoe UI', Arial, sans-serif; fill: #1a232e; }
      .small { font: 500 20px 'Segoe UI', Arial, sans-serif; fill: #5a6675; }
      .cbt { font: 700 30px 'Segoe UI', Arial, sans-serif; fill: #2953ff; }
      .bg { fill: #f7f8fa; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1600" height="900"/>

  <!-- left: the print report sheet -->
  <g transform="translate(90,120)">
    <rect class="ln" x="0" y="0" width="380" height="560" rx="8"/>
    <line class="thin" x1="30" y1="60" x2="350" y2="60"/>
    <text class="lab" x="30" y="44">Job: 7104-99</text>
    <line class="thin" x1="30" y1="110" x2="300" y2="110"/>
    <line class="thin" x1="30" y1="150" x2="330" y2="150"/>
    <line class="thin" x1="30" y1="190" x2="280" y2="190"/>
    <line class="thin" x1="30" y1="230" x2="320" y2="230"/>
    <line class="thin" x1="30" y1="270" x2="290" y2="270"/>
    <line class="thin" x1="30" y1="310" x2="335" y2="310"/>
    <line class="thin" x1="30" y1="350" x2="270" y2="350"/>
    <!-- reversal pair -->
    <line class="cbthin" x1="30" y1="390" x2="310" y2="390"/>
    <line class="cbthin" x1="30" y1="414" x2="310" y2="414"/>
    <text class="small" x="322" y="420">(Rev)</text>
    <!-- printed total box -->
    <rect class="ln" x="30" y="470" width="320" height="58"/>
    <text class="lab" x="46" y="508">Total:  24,318.77</text>
    <text class="small" x="0" y="600">the report's own totals ride along</text>
  </g>

  <!-- middle: the reconciliation gate -->
  <g transform="translate(600,180)">
    <path class="ln" d="M0 440 L0 120 Q0 40 90 40 Q180 40 180 120 L180 440"/>
    <text class="cbt" x="62" y="260">=</text>
    <text class="small" x="-8" y="490">parsed sum ties printed total,</text>
    <text class="small" x="12" y="520">to the cent, or refuse</text>
    <path class="cb" d="M-110 300 L-10 300"/>
    <path class="cb" d="M190 300 L290 300"/>
    <path class="cb" d="M270 288 L290 300 L270 312"/>
  </g>

  <!-- right-middle: triage bins -->
  <g transform="translate(950,140)">
    <g class="ln">
      <rect x="0" y="0"   width="250" height="56"/>
      <rect x="0" y="70"  width="250" height="56"/>
      <rect x="0" y="140" width="250" height="56"/>
      <rect x="0" y="210" width="250" height="56"/>
      <rect x="0" y="280" width="250" height="56"/>
      <rect x="0" y="350" width="250" height="56"/>
    </g>
    <rect class="cb" x="0" y="420" width="250" height="56"/>
    <text class="small" x="16" y="36">journal entry</text>
    <text class="small" x="16" y="106">clearing account</text>
    <text class="small" x="16" y="176">wrap-enrolled</text>
    <text class="small" x="16" y="246">materials only</text>
    <text class="small" x="16" y="316">professional</text>
    <text class="small" x="16" y="386">chase</text>
    <text class="cbt" x="16" y="459" style="font-size:24px">coverage current</text>
    <text class="small" x="0" y="530">every line in exactly one bin</text>
  </g>

  <!-- right: the package -->
  <g transform="translate(1310,240)">
    <rect class="ln" x="0" y="0" width="190" height="260" rx="8"/>
    <text class="cbt" x="24" y="76" style="font-size:56px">{ }</text>
    <path class="cb" d="M30 140 L30 190 M30 140 L44 140 M30 190 L44 190"/>
    <path class="cb" d="M160 140 L160 190 M160 140 L146 140 M160 190 L146 190"/>
    <text class="small" x="52" y="172">window</text>
    <text class="small" x="14" y="300">inclusive on both ends</text>
    <text class="small" x="30" y="330">byte-stable out</text>
  </g>

  <path class="cb" d="M1210 380 L1290 380 M1272 368 L1290 380 L1272 392"/>
</svg>
