<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" role="img" aria-label="Capital Spending Request Gate engine tile: each dollar trigger held against the Initial Commitment approval date, the five phase gates entered in sequence, and every contingency floor, fee and total re-derived from the cost stack.">
  <defs>
    <pattern id="grid-srg" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#eef2f8" stroke-width="1"/></pattern>
    <marker id="arw-srg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1200" height="675" fill="#f6f8fb"/><rect width="1200" height="675" fill="url(#grid-srg)"/>
  <rect x="16" y="16" width="1168" height="643" rx="18" fill="#ffffff" stroke="#e3e9f2" stroke-width="1.5"/>
  <text x="56" y="86" font-size="40" font-weight="700" fill="#0f2a5c">Capital Spending Request Gate</text>
  <text x="58" y="120" font-size="18" fill="#5b6b84" letter-spacing="0.4">SFS-E38-SRG &#183; was capital committed only after its gate, and does every standard re-derive?</text>
  <rect x="1020" y="52" width="128" height="34" rx="17" fill="#eaf1ff" stroke="#c9dcff"/><text x="1084" y="75" font-size="15" font-weight="600" fill="#2563eb" text-anchor="middle">READ-ONLY</text>

  <!-- request package -->
  <rect x="56" y="250" width="204" height="122" rx="14" fill="#0f2a5c"/>
  <text x="158" y="292" font-size="16" fill="#9fc0ff" text-anchor="middle">REQUEST PACKAGE</text>
  <text x="158" y="326" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">9 ARTIFACTS</text>
  <text x="158" y="352" font-size="13" fill="#8fb2f2" text-anchor="middle">ledger &#183; approvals &#183; budget</text>

  <path d="M260 311H360" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arw-srg)"/>
  <text x="310" y="299" font-size="13" fill="#5b6b84" text-anchor="middle">gated,</text>
  <text x="310" y="333" font-size="13" fill="#5b6b84" text-anchor="middle">re-derived</text>

  <!-- standards checks -->
  <rect x="372" y="184" width="470" height="286" rx="14" fill="#ffffff" stroke="#c9dcff" stroke-width="1.5"/>
  <text x="392" y="216" font-size="16" font-weight="700" fill="#0f2a5c">Triggers, sequence &amp; re-derivations</text>
  <g font-size="15" fill="#0f2a5c">
    <circle cx="404" cy="248" r="8" fill="#15803d"/><text x="424" y="253">Pursuit spend crossed its trigger after IC approval</text>
    <circle cx="404" cy="282" r="8" fill="#15803d"/><text x="424" y="287">Five phase gates entered in date order</text>
    <circle cx="404" cy="316" r="8" fill="#15803d"/><text x="424" y="321">Gate summary recomputes from the evidence</text>
    <circle cx="404" cy="350" r="8" fill="#15803d"/><text x="424" y="355">Hard contingency meets its floor to the cent</text>
    <circle cx="404" cy="384" r="8" fill="#15803d"/><text x="424" y="389">CM &amp; Development Fees re-derive from the cost stack</text>
    <circle cx="404" cy="418" r="8" fill="#c0392b"/><text x="424" y="423" fill="#c0392b">One deposit went non-refundable before the gate</text>
    <circle cx="404" cy="452" r="8" fill="#c8912f"/><text x="424" y="457" fill="#c8912f">A current-phase deliverable is outstanding &#8212; to chase</text>
  </g>

  <!-- verdict -->
  <rect x="866" y="250" width="278" height="122" rx="14" fill="#fdf7ec" stroke="#eecfa3" stroke-width="1.5"/>
  <text x="1005" y="292" font-size="17" fill="#c8912f" text-anchor="middle">verdict: FAIL</text>
  <text x="1005" y="322" font-size="14" fill="#5b6b84" text-anchor="middle">floors and fees re-derive, gates in order &#8212;</text>
  <text x="1005" y="344" font-size="14" fill="#5b6b84" text-anchor="middle">capital was committed before its trigger</text>

  <rect x="56" y="560" width="1088" height="58" rx="14" fill="#0f2a5c"/>
  <text x="82" y="596" font-size="18" font-weight="600" fill="#ffffff">29 controls</text>
  <text x="256" y="596" font-size="18" font-weight="600" fill="#9fc0ff">10 families</text>
  <text x="420" y="596" font-size="18" font-weight="600" fill="#ffffff">10,424 tests</text>
  <text x="566" y="596" font-size="18" font-weight="600" fill="#9fc0ff">read-only</text>
  <text x="1118" y="596" font-size="15" fill="#8fb2f2" text-anchor="end" letter-spacing="1.5">SFS-E38-SRG</text>
</svg>
